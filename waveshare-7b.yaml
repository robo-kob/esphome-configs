esphome:
  name: esphome-web-c47f0c
  friendly_name: ESPHome Display 7" 1024x600
  min_version: 2026.4.0
  name_add_mac_suffix: false
  platformio_options:
    board_upload.maximum_ram_size: 524288
  on_boot:
    - priority: -100
      then:
        - lvgl.label.update:
            id: lbl_play_pause
            text: !lambda return std::string(LV_SYMBOL_PLAY);
        - lvgl.label.update:
            id: lbl_prev
            text: !lambda return std::string(LV_SYMBOL_PREV);
        - lvgl.label.update:
            id: lbl_next
            text: !lambda return std::string(LV_SYMBOL_NEXT);
        - lvgl.label.update:
            id: lbl_vol_down
            text: !lambda return std::string(LV_SYMBOL_VOLUME_MID);
        - lvgl.label.update:
            id: lbl_vol_up
            text: !lambda return std::string(LV_SYMBOL_VOLUME_MAX);
        - lvgl.label.update:
            id: lbl_cover_sym
            text: !lambda return std::string(LV_SYMBOL_AUDIO);
        - lvgl.label.update:
            id: lbl_mute
            text: "Mute"

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

psram:
  mode: octal
  speed: 80MHz

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: "Waveshare 7B Fallback"
    password: "12345678"

captive_portal:

external_components:
  - source:
      type: git
      url: https://github.com/fuzzybear62/esphome-waveshare_io_ch32v003
      ref: main
    components: [ waveshare_io_ch32v003 ]

i2c:
  id: bus_a
  sda: GPIO8
  scl: GPIO9
  scan: true
  frequency: 400kHz

waveshare_io_ch32v003:
  id: waveshare_io_hub
  i2c_id: bus_a
  address: 0x24

output:
  - platform: waveshare_io_ch32v003
    id: wave_io_pwm_output
    inverted: true
    zero_means_zero: true
    waveshare_io_ch32v003_id: waveshare_io_hub
    safe_pwm_levels:
      min_value: 0
      max_value: 247

light:
  - platform: monochromatic
    output: wave_io_pwm_output
    name: "Display Backlight"
    id: display_backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 0ms

switch:
  - platform: gpio
    name: "Backlight Switch"
    id: backlight_switch
    internal: true
    pin:
      waveshare_io_ch32v003: waveshare_io_hub
      number: 2
      mode: OUTPUT
    restore_mode: ALWAYS_ON

http_request:
  useragent: esphome
  timeout: 5s

online_image:
  - id: album_cover
    url: "http://192.168.1.33:8123/"
    format: jpeg
    type: RGB565
    resize: 300x300
    on_download_finished:
      - lvgl.image.update:
          id: img_cover
          src: album_cover

globals:
  - id: local_position_s
    type: float
    restore_value: no
    initial_value: '0'
  - id: local_position_ts
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: mute_active
    type: bool
    restore_value: no
    initial_value: 'false'

sensor:
  - platform: homeassistant
    id: mxn10_media_duration
    entity_id: media_player.streamer_lossles_mxn10
    attribute: media_duration
    internal: true

  - platform: homeassistant
    id: mxn10_media_position
    entity_id: media_player.streamer_lossles_mxn10
    attribute: media_position
    internal: true
    on_value:
      - lambda: |-
          id(local_position_s) = x;
          id(local_position_ts) = millis();

text_sensor:
  - platform: homeassistant
    id: mxn10_state
    entity_id: media_player.streamer_lossles_mxn10
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_play_pause
          text: !lambda |-
            return std::string(x == "playing" ? LV_SYMBOL_PAUSE : LV_SYMBOL_PLAY);

  - platform: homeassistant
    id: mxn10_title
    entity_id: media_player.streamer_lossles_mxn10
    attribute: media_title
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_title
          text: !lambda |-
            return x.length() > 0 ? x : std::string("Kein Titel");

  - platform: homeassistant
    id: mxn10_artist
    entity_id: media_player.streamer_lossles_mxn10
    attribute: media_artist
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_artist
          text: !lambda |-
            return x.length() > 0 ? x : std::string("-");

  - platform: homeassistant
    id: mxn10_album
    entity_id: media_player.streamer_lossles_mxn10
    attribute: media_album_name
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_album
          text: !lambda return x.c_str();

  - platform: homeassistant
    id: mxn10_source
    entity_id: media_player.streamer_lossles_mxn10
    attribute: source
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_source
          text: !lambda |-
            return x.empty() ? std::string("") : "Quelle: " + x;

  - platform: homeassistant
    id: mxn10_entity_picture
    entity_id: media_player.streamer_lossles_mxn10
    attribute: entity_picture
    internal: true
    on_value:
      - lambda: |-
          if (!x.empty()) {
            id(album_cover).set_url(("http://192.168.1.33:8123" + x).c_str());
          }
      - component.update: album_cover

interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return id(mxn10_media_duration).has_state() && id(mxn10_media_duration).state > 0;'
          then:
            - lvgl.bar.update:
                id: progress_bar
                value: !lambda |-
                  float duration = id(mxn10_media_duration).state;
                  float position = id(local_position_s);
                  if (id(mxn10_state).has_state() && id(mxn10_state).state == "playing") {
                    position += (millis() - id(local_position_ts)) / 1000.0f;
                  }
                  if (position > duration) position = duration;
                  return (int)(position / duration * 100);
            - lvgl.label.update:
                id: lbl_time_pos
                text: !lambda |-
                  float position = id(local_position_s);
                  if (id(mxn10_state).has_state() && id(mxn10_state).state == "playing") {
                    position += (millis() - id(local_position_ts)) / 1000.0f;
                  }
                  float duration = id(mxn10_media_duration).state;
                  if (position > duration) position = duration;
                  char buf[16];
                  snprintf(buf, sizeof(buf), "%d:%02d", ((int)position)/60, ((int)position)%60);
                  return std::string(buf);
            - lvgl.label.update:
                id: lbl_time_dur
                text: !lambda |-
                  float duration = id(mxn10_media_duration).state;
                  char buf[16];
                  snprintf(buf, sizeof(buf), "%d:%02d", ((int)duration)/60, ((int)duration)%60);
                  return std::string(buf);

button:
  - platform: template
    name: "MXN10 Previous"
    id: mxn10_previous
    on_press:
      - homeassistant.action:
          action: media_player.media_previous_track
          data:
            entity_id: media_player.streamer_lossles_mxn10

  - platform: template
    name: "MXN10 Play Pause"
    id: mxn10_play_pause
    on_press:
      - homeassistant.action:
          action: media_player.media_play_pause
          data:
            entity_id: media_player.streamer_lossles_mxn10

  - platform: template
    name: "MXN10 Next"
    id: mxn10_next
    on_press:
      - homeassistant.action:
          action: media_player.media_next_track
          data:
            entity_id: media_player.streamer_lossles_mxn10

  - platform: template
    name: "Topping Mute"
    id: topping_mute
    on_press:
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.universal_remote
            device: "Topping Pre 90"
            command: "mute"

  - platform: template
    name: "Topping Leiser"
    id: topping_volume_down
    on_press:
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.universal_remote
            device: "Topping Pre 90"
            command: "volume_down"

  - platform: template
    name: "Topping Lauter"
    id: topping_volume_up
    on_press:
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.universal_remote
            device: "Topping Pre 90"
            command: "volume_up"

  - platform: template
    name: "Topping Input"
    id: topping_input_toggle
    on_press:
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.universal_remote
            device: "Topping Pre 90"
            command: "input_rca"

