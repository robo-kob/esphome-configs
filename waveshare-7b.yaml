      - file: "gfonts://Roboto"
        glyphs: "ÀÁÂÃÄÅÆÇÈÉÊËÌÍÎÏÐÑÒÓÔÕÖØÙÚÛÜÝÞßàáâãäåæçèéêëìíîïðñòóôõöøùúûüýþÿ¡¿"

display:
  - platform: rpi_dpi_rgb
    id: waveshare_display
    update_interval: never
    auto_clear_enabled: false
    color_order: RGB
    pclk_frequency: 30MHz
    pclk_inverted: true
    dimensions:
      width: 1024
      height: 600
    de_pin: GPIO5
    hsync_pin:
      number: GPIO46
      ignore_strapping_warning: true
    vsync_pin:
      number: GPIO3
      ignore_strapping_warning: true
    pclk_pin: GPIO7
    reset_pin:
      waveshare_io_ch32v003: waveshare_io_hub
      number: 3
    hsync_back_porch:  152
    hsync_front_porch:  48
    hsync_pulse_width: 162
    vsync_back_porch:   13
    vsync_front_porch:   3
    vsync_pulse_width:  45
    data_pins:
      red:
        - 1
        - 2
        - 42
        - 41
        - 40
      green:
        - 39
        - 0
        - 45
        - 48
        - 47
        - 21
      blue:
        - 14
        - 38
        - 18
        - 17
        - 10

touchscreen:
  - platform: gt911
    id: waveshare_touch
    interrupt_pin: GPIO4
    reset_pin:
      waveshare_io_ch32v003: waveshare_io_hub
      number: 1
      mode: OUTPUT
    on_touch:
      - light.turn_on:
          id: display_backlight
          brightness: 100%

lvgl:
  displays:
    - waveshare_display
  touchscreens:
    - waveshare_touch
  default_font: roboto_24
  on_idle:
    timeout: 60s
    then:
      - light.turn_on:
          id: display_backlight
          brightness: 10%

  pages:
    - id: main_page
      # Heller Hintergrund (leichtes Lavendel)
      bg_color: 0xEEEBF8
      bg_opa: cover

      widgets:

        # ── Input Button (oben rechts) ──────────────────────────────────
        - button:
            id: btn_input
            x: 874
            y: 10
            width: 140
            height: 50
            bg_color: 0xDDD8EE
            bg_opa: cover
            border_width: 1
            border_color: 0xBBB5CC
            radius: 25
            pressed:
              bg_color: 0xCCCADE
            on_click:
              then:
                - button.press: topping_input_toggle
            widgets:
              - label:
                  text: "Input"
                  align: center
                  text_color: 0x444466

        # ── Album Cover (Kreis, rechte Seite) ──────────────────────────
        - obj:
            x: 687
            y: 120
            width: 300
            height: 300
            radius: 12
            bg_color: 0xCDCAE8
            border_color: 0xBBB8DA
            border_width: 2
            pad_all: 0
            widgets:
              - label:
                  id: lbl_cover_sym
                  text: "?"
                  text_font: montserrat_48
                  text_color: 0x8888AA
                  align: center
              - image:
                  id: img_cover
                  src: album_cover
                  align: center

        # ── Titel ───────────────────────────────────────────────────────
        - label:
            id: lbl_title
            x: 50
            y: 80
            width: 610
            height: 50
            text: "Kein Titel"
            text_color: 0x1A1840
            text_font: roboto_36
            text_align: left
            long_mode: scroll_circular

        # ── Artist ──────────────────────────────────────────────────────
        - label:
            id: lbl_artist
            x: 50
            y: 145
            width: 580
            height: 36
            text: "-"
            text_color: 0x7B6FA0
            text_font: roboto_24
            text_align: left
            long_mode: dot

        # ── Album ───────────────────────────────────────────────────────
        - label:
            id: lbl_album
            x: 50
            y: 186
            width: 580
            height: 30
            text: ""
            text_color: 0xAAAAAA
            text_font: roboto_18
            text_align: left
            long_mode: dot

        # ── Quelle ──────────────────────────────────────────────────────
        - label:
            id: lbl_source
            x: 50
            y: 220
            width: 580
            height: 26
            text: ""
            text_color: 0xBBBBBB
            text_font: roboto_18
            text_align: left
            long_mode: dot

        # ── Steuertasten-Reihe (zentriert in 640px) ─────────────────────
        # Reihenfolge: Vol-  |  Prev  |  Play  |  Next  |  Vol+
        # Breiten:      65        65      90       65        65
        # Abstände:        15        15       15        15
        # Gesamt: 65+15+65+15+90+15+65+15+65 = 410px
        # Startpunkt: (640-410)/2 = 115

        # Vol-
        - button:
            id: btn_vol_down
            x: 115
            y: 262
            width: 65
            height: 65
            bg_color: 0xEEEBF8
            bg_opa: cover
            border_width: 2
            border_color: 0xCCCADE
            radius: 32
            pressed:
              bg_color: 0xDDDAF0
            on_click:
              then:
                - button.press: topping_volume_down
            widgets:
              - label:
                  id: lbl_vol_down
                  text: ""
                  text_font: montserrat_24
                  text_color: 0x555577
                  align: center

        # Prev
        - button:
            id: btn_prev
            x: 195
            y: 262
            width: 65
            height: 65
            bg_color: 0xEEEBF8
            bg_opa: cover
            border_width: 2
            border_color: 0xCCCADE
            radius: 32
            pressed:
              bg_color: 0xDDDAF0
            on_click:
              then:
                - button.press: mxn10_previous
            widgets:
              - label:
                  id: lbl_prev
                  text: ""
                  text_font: montserrat_24
                  text_color: 0x555577
                  align: center

        # Play/Pause (groß, lila Akzent)
        - button:
            id: btn_play_pause
            x: 275
            y: 247
            width: 90
            height: 90
            bg_color: 0x7B5EA7
            bg_opa: cover
            border_width: 0
            radius: 45
            pressed:
              bg_color: 0x5B3E87
            on_click:
              then:
                - button.press: mxn10_play_pause
            widgets:
              - label:
                  id: lbl_play_pause
                  text: ""
                  text_font: montserrat_28
                  text_color: 0xFFFFFF
                  align: center

        # Next
        - button:
            id: btn_next
            x: 380
            y: 262
            width: 65
            height: 65
            bg_color: 0xEEEBF8
            bg_opa: cover
            border_width: 2
            border_color: 0xCCCADE
            radius: 32
            pressed:
              bg_color: 0xDDDAF0
            on_click:
              then:
                - button.press: mxn10_next
            widgets:
              - label:
                  id: lbl_next
                  text: ""
                  text_font: montserrat_24
                  text_color: 0x555577
                  align: center

        # Vol+
        - button:
            id: btn_vol_up
            x: 460
            y: 262
            width: 65
            height: 65
            bg_color: 0xEEEBF8
            bg_opa: cover
            border_width: 2
            border_color: 0xCCCADE
            radius: 32
            pressed:
              bg_color: 0xDDDAF0
            on_click:
              then:
                - button.press: topping_volume_up
            widgets:
              - label:
                  id: lbl_vol_up
                  text: ""
                  text_font: montserrat_24
                  text_color: 0x555577
                  align: center

        # ── Fortschrittsbalken ──────────────────────────────────────────
        - bar:
            id: progress_bar
            x: 50
            y: 380
            width: 560
            height: 8
            min_value: 0
            max_value: 100
            value: 0
            bg_color: 0xD8D4EE
            bg_opa: cover
            indicator:
              bg_color: 0x7B5EA7
              bg_opa: cover

        # Zeit Position
        - label:
            id: lbl_time_pos
            x: 50
            y: 396
            text: "0:00"
            text_color: 0x9090AA
            text_font: roboto_18

        # Zeit Dauer
        - label:
            id: lbl_time_dur
            x: 500
            y: 396
            width: 110
            text: "0:00"
            text_color: 0x9090AA
            text_font: roboto_18
            text_align: right

        # ── Mute Button (unten links) ────────────────────────────────────
        - button:
            id: btn_mute
            x: 50
            y: 455
            width: 130
            height: 52
            bg_color: 0xDDD8EE
            bg_opa: cover
            border_width: 1
            border_color: 0xBBB5CC
            radius: 26
            pressed:
              bg_color: 0xCCCADE
            on_click:
              then:
                - button.press: topping_mute
                - lambda: id(mute_active) = !id(mute_active);
                - if:
                    condition:
                      lambda: return id(mute_active);
                    then:
                      - lvgl.label.update:
                          id: lbl_mute
                          text: "Mute"
                          text_color: 0xCC2222
                    else:
                      - lvgl.label.update:
                          id: lbl_mute
                          text: "Mute"
                          text_color: 0x444466
            widgets:
              - label:
                  id: lbl_mute
                  text: "Mute"
                  align: center
                  text_color: 0x444466
