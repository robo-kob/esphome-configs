interval:
  # Liest LVGL-Touch-Position alle 50ms fuer Wisch-Erkennung
  # (on_touch feuert nur einmal; LVGL trackt kontinuierlich)
  - interval: 50ms
    then:
      - lambda: |-
          if (!id(swipe_tracking)) return;
          lv_indev_t *indev = lv_indev_get_next(nullptr);
          while (indev != nullptr) {
            if (lv_indev_get_type(indev) == LV_INDEV_TYPE_POINTER) {
              lv_point_t pt;
              lv_indev_get_point(indev, &pt);
              if (pt.x >= 0 && pt.x <= 1024) {
                id(swipe_last_x) = (int)pt.x;
              }
              break;
            }
            indev = lv_indev_get_next(indev);
          }

  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return id(mxn10_media_duration).has_state() && id(mxn10_media_duration).state > 0;'
          then:
            - lvgl.bar.update:
                id: progress_bar
                value: !lambda |-
                  float duration = id(mxn10_media_duration).state;
                  float position = id(local_position_s);
                  if (id(mxn10_state).has_state() && id(mxn10_state).state == "playing") {
                    position += (millis() - id(local_position_ts)) / 1000.0f;
                  }
                  if (position > duration) position = duration;
                  return (int)(position / duration * 100);
            - lvgl.label.update:
                id: lbl_time_pos
                text: !lambda |-
                  float position = id(local_position_s);
                  if (id(mxn10_state).has_state() && id(mxn10_state).state == "playing") {
                    position += (millis() - id(local_position_ts)) / 1000.0f;
                  }
                  float duration = id(mxn10_media_duration).state;
                  if (position > duration) position = duration;
                  char buf[16];
                  snprintf(buf, sizeof(buf), "%d:%02d", ((int)position)/60, ((int)position)%60);
                  return std::string(buf);
            - lvgl.label.update:
                id: lbl_time_dur
                text: !lambda |-
                  float duration = id(mxn10_media_duration).state;
                  char buf[16];
                  snprintf(buf, sizeof(buf), "%d:%02d", ((int)duration)/60, ((int)duration)%60);
                  return std::string(buf);

