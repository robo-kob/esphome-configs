display:
  - platform: rpi_dpi_rgb
    id: waveshare_display
    update_interval: never
    auto_clear_enabled: false
    color_order: RGB
    pclk_frequency: 30MHz
    pclk_inverted: true
    dimensions:
      width: 1024
      height: 600
    de_pin: GPIO5
    hsync_pin:
      number: GPIO46
      ignore_strapping_warning: true
    vsync_pin:
      number: GPIO3
      ignore_strapping_warning: true
    pclk_pin: GPIO7
    reset_pin:
      waveshare_io_ch32v003: waveshare_io_hub
      number: 3
    hsync_back_porch:  152
    hsync_front_porch:  48
    hsync_pulse_width: 162
    vsync_back_porch:   13
    vsync_front_porch:   3
    vsync_pulse_width:  45
    data_pins:
      red:
        - 1
        - 2
        - 42
        - 41
        - 40
      green:
        - 39
        - 0
        - 45
        - 48
        - 47
        - 21
      blue:
        - 14
        - 38
        - 18
        - 17
        - 10

touchscreen:
  - platform: gt911
    id: waveshare_touch
    interrupt_pin: GPIO4
    reset_pin:
      waveshare_io_ch32v003: waveshare_io_hub
      number: 1
      mode: OUTPUT
    on_touch:
      - light.turn_on:
          id: display_backlight
          brightness: 100%
      - lambda: |-
          if (id(swipe_start_x) < 0) {
            id(swipe_start_x) = touch.x;
            id(swipe_last_x)  = touch.x;
            id(swipe_tracking) = true;
          }
    on_release:
      - lambda: |-
          id(swipe_tracking) = false;
          ESP_LOGI("swipe", "RELEASE start=%d last=%d delta=%d",
                   id(swipe_start_x), id(swipe_last_x),
                   id(swipe_start_x) - id(swipe_last_x));
      - if:
          condition:
            lambda: |-
              return id(swipe_start_x) >= 0 && id(swipe_last_x) >= 0
                     && (id(swipe_start_x) - id(swipe_last_x)) > 100;
          then:
            - lvgl.page.next:
                animation: FADE_IN
                time: 200ms
            - lvgl.widget.update:
                id: dot_1
                bg_color: 0xCCCCCC
            - lvgl.widget.update:
                id: dot_2
                bg_color: 0x7B5EA7
            - lvgl.widget.update:
                id: dot_1b
                bg_color: 0xCCCCCC
            - lvgl.widget.update:
                id: dot_2b
                bg_color: 0x7B5EA7
      - if:
          condition:
            lambda: |-
              return id(swipe_start_x) >= 0 && id(swipe_last_x) >= 0
                     && (id(swipe_last_x) - id(swipe_start_x)) > 100;
          then:
            - lvgl.page.previous:
                animation: FADE_IN
                time: 200ms
            - lvgl.widget.update:
                id: dot_1
                bg_color: 0x7B5EA7
            - lvgl.widget.update:
                id: dot_2
                bg_color: 0xCCCCCC
            - lvgl.widget.update:
                id: dot_1b
                bg_color: 0x7B5EA7
            - lvgl.widget.update:
                id: dot_2b
                bg_color: 0xCCCCCC
      - lambda: |-
          id(swipe_start_x) = -1;
          id(swipe_last_x) = -1;

lvgl:
  displays:
    - waveshare_display
  touchscreens:
    - waveshare_touch
  default_font: roboto_24
  on_idle:
    timeout: 60s
    then:
      - light.turn_on:
          id: display_backlight
          brightness: 10%
  on_gesture:
    then:
      - if:
          condition:
            lambda: |-
              lv_indev_t *indev = lv_indev_get_act();
              return indev != nullptr && lv_indev_get_gesture_dir(indev) == LV_DIR_LEFT;
          then:
            - lvgl.page.next:
                animation: FADE_IN
                time: 200ms
            - lvgl.widget.update:
                id: dot_1
                bg_color: 0xCCCCCC
            - lvgl.widget.update:
                id: dot_2
                bg_color: 0x7B5EA7
            - lvgl.widget.update:
                id: dot_1b
                bg_color: 0xCCCCCC
            - lvgl.widget.update:
                id: dot_2b
                bg_color: 0x7B5EA7
      - if:
          condition:
            lambda: |-
              lv_indev_t *indev = lv_indev_get_act();
              return indev != nullptr && lv_indev_get_gesture_dir(indev) == LV_DIR_RIGHT;
          then:
            - lvgl.page.previous:
                animation: FADE_IN
                time: 200ms
            - lvgl.widget.update:
                id: dot_1
                bg_color: 0x7B5EA7
            - lvgl.widget.update:
                id: dot_2
                bg_color: 0xCCCCCC
            - lvgl.widget.update:
