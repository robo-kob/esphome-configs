    id: roboto_36
    size: 36
    bpp: 4
    extras:
      - file: "gfonts://Roboto"
        glyphs: "ÀÁÂÃÄÅÆÇÈÉÊËÌÍÎÏÐÑÒÓÔÕÖØÙÚÛÜÝÞßàáâãäåæçèéêëìíîïðñòóôõöøùúûüýþÿ¡¿"
  - file: "gfonts://Roboto"
    id: roboto_24
    size: 24
    bpp: 4
    extras:
      - file: "gfonts://Roboto"
        glyphs: "ÀÁÂÃÄÅÆÇÈÉÊËÌÍÎÏÐÑÒÓÔÕÖØÙÚÛÜÝÞßàáâãäåæçèéêëìíîïðñòóôõöøùúûüýþÿ¡¿"
  - file: "gfonts://Roboto"
    id: roboto_18
    size: 18
