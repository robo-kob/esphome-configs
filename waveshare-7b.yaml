esphome:
  name: esphome-web-c47f0c
  friendly_name: ESPHome Display 7" 1024x600
  min_version: 2026.4.0
  name_add_mac_suffix: false
  platformio_options:
    board_upload.maximum_ram_size: 524288
  on_boot:
    - priority: -100
      then:
        - lvgl.label.update:
            id: lbl_play_pause
            text: !lambda return std::string(LV_SYMBOL_PLAY);
        - lvgl.label.update:
            id: lbl_prev
            text: !lambda return std::string(LV_SYMBOL_PREV);
        - lvgl.label.update:
            id: lbl_next
            text: !lambda return std::string(LV_SYMBOL_NEXT);
        - lvgl.label.update:
            id: lbl_vol_down
            text: !lambda return std::string(LV_SYMBOL_VOLUME_MID);
        - lvgl.label.update:
            id: lbl_vol_up
            text: !lambda return std::string(LV_SYMBOL_VOLUME_MAX);
        - lvgl.label.update:
            id: lbl_cover_sym
            text: !lambda return std::string(LV_SYMBOL_AUDIO);
        - lvgl.label.update:
            id: lbl_mute
            text: !lambda return std::string(LV_SYMBOL_MUTE) + " Mute";
        - lvgl.label.update:
            id: lbl_input
            text: "󰋺"
            text_font: fa5_icons

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      # Code und Read-Only-Daten in PSRAM -> IRAM fuer LVGL frei
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"
      # LVGL auf Core 1, WiFi bleibt auf Core 0
      CONFIG_ESP_MAIN_TASK_AFFINITY_CPU1: "y"
      # Compiler auf Geschwindigkeit optimieren
      CONFIG_COMPILER_OPTIMIZATION_PERF: "y"

psram:
  mode: octal
  speed: 80MHz

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: "Waveshare 7B Fallback"
    password: "12345678"

captive_portal:

external_components:
  - source:
      type: git
      url: https://github.com/fuzzybear62/esphome-waveshare_io_ch32v003
      ref: main
    components: [ waveshare_io_ch32v003 ]

i2c:
  id: bus_a
  sda: GPIO8
  scl: GPIO9
  scan: true
  frequency: 400kHz

waveshare_io_ch32v003:
  id: waveshare_io_hub
  i2c_id: bus_a
  address: 0x24

output:
  - platform: waveshare_io_ch32v003
    id: wave_io_pwm_output
    inverted: true
    zero_means_zero: true
    waveshare_io_ch32v003_id: waveshare_io_hub
    safe_pwm_levels:
      min_value: 0
      max_value: 247

light:
  - platform: monochromatic
    output: wave_io_pwm_output
    name: "Display Backlight"
    id: display_backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 0ms

switch:
  - platform: gpio
    name: "Backlight Switch"
    id: backlight_switch
    internal: true
    pin:
      waveshare_io_ch32v003: waveshare_io_hub
      number: 2
      mode: OUTPUT
    restore_mode: ALWAYS_ON

http_request:
  useragent: esphome
  timeout: 5s

online_image:
  - id: album_cover
    url: "http://192.168.1.33:8123/"
    format: jpeg
    type: RGB565
    resize: 400x400
    on_download_finished:
      - lvgl.image.update:
          id: img_cover
          src: album_cover

globals:
  - id: local_position_s
    type: float
    restore_value: no
    initial_value: '0'
  - id: local_position_ts
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: mute_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: swipe_start_x
    type: int
    restore_value: no
    initial_value: '-1'
  - id: swipe_last_x
    type: int
    restore_value: no
    initial_value: '-1'
  - id: swipe_tracking
    type: bool
    restore_value: no
    initial_value: 'false'

sensor:
  - platform: homeassistant
    id: mxn10_media_duration
    entity_id: media_player.streamer_lossles_mxn10
    attribute: media_duration
    internal: true

  - platform: homeassistant
    id: mxn10_media_position
    entity_id: media_player.streamer_lossles_mxn10
    attribute: media_position
    internal: true
    on_value:
      - lambda: |-
          id(local_position_s) = x;
          id(local_position_ts) = millis();


  # ── Seite 2: Wetterstation ──────────────────────────────────────────
  - platform: homeassistant
    id: outdoor_temp_sensor
    entity_id: sensor.gw1100a_outdoor_temperature
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_outdoor_temp
          text: !lambda |-
            char buf[16];
            snprintf(buf, sizeof(buf), "%.1f°C", x);
            return std::string(buf);

  - platform: homeassistant
    id: outdoor_humidity_sensor
    entity_id: sensor.gw1100a_humidity
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_humidity
          text: !lambda |-
            char buf[16];
            snprintf(buf, sizeof(buf), "%.0f%%", x);
            return std::string(buf);

  - platform: homeassistant
    id: uv_index_sensor
    entity_id: sensor.gw1100a_uv_index
    internal: true
    on_value:
      - if:
          condition:
            lambda: return x > 3;
          then:
            - lvgl.widget.update:
                id: lbl_uv
                hidden: false
            - lvgl.label.update:
                id: lbl_uv
                text: !lambda |-
                  char buf[16];
                  snprintf(buf, sizeof(buf), "UV-Index: %.0f", x);
                  if (x >= 8) return std::string(buf) + " (sehr hoch)";
                  if (x >= 6) return std::string(buf) + " (hoch)";
                  return std::string(buf) + " (mittel)";
          else:
            - lvgl.widget.update:
                id: lbl_uv
                hidden: true

  - platform: homeassistant
    id: rain_24h_sensor
    entity_id: sensor.gw1100a_24h_rain
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_rain
          text: !lambda |-
            char buf[16];
            snprintf(buf, sizeof(buf), "%.1f mm", x);
            return std::string(buf);

  # Wettervorhersage Temperaturen
  - platform: homeassistant
    id: fc1_temp_sensor
    entity_id: sensor.forecast_tag_1_temp
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_fc1_temp
          text: !lambda |-
            char buf[16];
            snprintf(buf, sizeof(buf), "%.0f°C", x);
            return std::string(buf);

  - platform: homeassistant
    id: fc2_temp_sensor
    entity_id: sensor.forecast_tag_2_temp
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_fc2_temp
          text: !lambda |-
            char buf[16];
            snprintf(buf, sizeof(buf), "%.0f°C", x);
            return std::string(buf);

  - platform: homeassistant
    id: fc3_temp_sensor
    entity_id: sensor.forecast_tag_3_temp
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_fc3_temp
          text: !lambda |-
            char buf[16];
            snprintf(buf, sizeof(buf), "%.0f°C", x);
            return std::string(buf);

  # ── Seite 2: Energie ────────────────────────────────────────────────
  - platform: homeassistant
    id: house_power_sensor
    entity_id: sensor.poweropti_35fd8_lokal_leistung
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_house_power
          text: !lambda |-
            char buf[16];
            if (x >= 1000.0f) snprintf(buf, sizeof(buf), "%.2f kW", x/1000.0f);
            else snprintf(buf, sizeof(buf), "%.0f W", x);
            return std::string(buf);
  - platform: homeassistant
    id: solar_power_sensor
    entity_id: sensor.solarbank_2_e1600_pro_solarleistung
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_solar_power
          text: !lambda |-
            char buf[16];
            if (x >= 1000.0f) snprintf(buf, sizeof(buf), "%.2f kW", x/1000.0f);
            else snprintf(buf, sizeof(buf), "%.0f W", x);
