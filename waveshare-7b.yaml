esphome:
  name: esphome-web-c47f0c
  friendly_name: ESPHome Display 7" 1024x600
  min_version: 2026.4.0
  name_add_mac_suffix: false
  platformio_options:
    board_upload.maximum_ram_size: 524288

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

psram:
  mode: octal
  speed: 80MHz

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Waveshare 7B Fallback"
    password: "12345678"

captive_portal:

# CH32V003 Komponente fuer Backlight, Touch-Reset und Display-Reset
external_components:
  - source:
      type: git
      url: https://github.com/fuzzybear62/esphome-waveshare_io_ch32v003
      ref: main
    components: [ waveshare_io_ch32v003 ]

i2c:
  id: bus_a
  sda: GPIO8
  scl: GPIO9
  scan: true
  frequency: 400kHz

waveshare_io_ch32v003:
  id: waveshare_io_hub
  i2c_id: bus_a
  address: 0x24

# Backlight PWM ueber CH32V003
output:
  - platform: waveshare_io_ch32v003
    id: wave_io_pwm_output
    inverted: true
    zero_means_zero: true
    waveshare_io_ch32v003_id: waveshare_io_hub
    safe_pwm_levels:
      min_value: 0
      max_value: 247

light:
  - platform: monochromatic
    output: wave_io_pwm_output
    name: "Display Backlight"
    id: display_backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 0ms

# Backlight GPIO-Switch (pin 2 des CH32V003)
switch:
  - platform: gpio
    name: "Backlight Switch"
    id: backlight_switch
    internal: true
    pin:
      waveshare_io_ch32v003: waveshare_io_hub
      number: 2
      mode: OUTPUT
    restore_mode: ALWAYS_ON

display:
  - platform: rpi_dpi_rgb
    id: waveshare_display
    update_interval: never
    auto_clear_enabled: false
    color_order: RGB
    pclk_frequency: 30MHz
    pclk_inverted: true
    dimensions:
      width: 1024
      height: 600
    de_pin: GPIO5
    hsync_pin:
      number: GPIO46
      ignore_strapping_warning: true
    vsync_pin:
      number: GPIO3
      ignore_strapping_warning: true
    pclk_pin: GPIO7
    reset_pin:
      waveshare_io_ch32v003: waveshare_io_hub
      number: 3
    hsync_back_porch:  152
    hsync_front_porch:  48
    hsync_pulse_width: 162
    vsync_back_porch:   13
    vsync_front_porch:   3
    vsync_pulse_width:  45
    data_pins:
      red:
        - 1         # r3
        - 2         # r4
        - 42        # r5
        - 41        # r6
        - 40        # r7
      green:
        - 39        # g2
        - 0         # g3
        - 45        # g4
        - 48        # g5
        - 47        # g6
        - 21        # g7
      blue:
        - 14        # b3
        - 38        # b4
        - 18        # b5
        - 17        # b6
        - 10        # b7

touchscreen:
  - platform: gt911
    id: waveshare_touch
    interrupt_pin: GPIO4
    reset_pin:
      waveshare_io_ch32v003: waveshare_io_hub
      number: 1
      mode: OUTPUT

lvgl:
  displays:
    - waveshare_display
  touchscreens:
    - waveshare_touch
  default_font: montserrat_14

  pages:
    - id: main_page
      bg_color: 0xFFFFFF
      bg_opa: cover
      widgets:
        - label:
            text: "Waveshare 7B - ESPHome OK"
            align: center
            text_color: 0x000000
