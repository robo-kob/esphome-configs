esphome:
  name: esphome-web-c47f0c
  friendly_name: ESPHome Display 7" 1024x600
  min_version: 2026.4.0
  name_add_mac_suffix: false
  platformio_options:
    board_upload.maximum_ram_size: 524288

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Waveshare 7B Fallback"
    password: "12345678"

captive_portal:

i2c:
  id: bus_a
  sda: GPIO8
  scl: GPIO9
  scan: true

display:
  - platform: rpi_dpi_rgb
    id: waveshare_display
    update_interval: never
    auto_clear_enabled: false
    color_order: RGB
    pclk_frequency: 30MHz
    pclk_inverted: true
    dimensions:
      width: 1024
      height: 600
    de_pin: GPIO5
    hsync_pin:
      number: GPIO46
      ignore_strapping_warning: true
    vsync_pin:
      number: GPIO3
      ignore_strapping_warning: true
    pclk_pin: GPIO7
    hsync_back_porch: 160
    hsync_front_porch: 160
    hsync_pulse_width: 10
    vsync_back_porch: 23
    vsync_front_porch: 12
    vsync_pulse_width: 3
    data_pins:
      red:
        - 1         # r3
        - 2         # r4
        - 42        # r5
        - 41        # r6
        - 40        # r7
      green:
        - 39        # g2
        - 0         # g3
        - 45        # g4
        - 48        # g5
        - 47        # g6
        - 21        # g7
      blue:
        - 14        # b3
        - 38        # b4
        - 18        # b5
        - 17        # b6
        - 10        # b7

interval:
  - interval: 3s
    then:
      - lambda: |-
          static uint8_t step = 0;
          i2c::ErrorCode e;
          switch (step % 4) {
            case 0: { uint8_t d[] = {0xFF};             e = id(bus_a)->write(0x24, d, 1, true); ESP_LOGI("BL", "0xFF -> %d", (int)e); break; }
            case 1: { uint8_t d[] = {0x01, 0xFF};       e = id(bus_a)->write(0x24, d, 2, true); ESP_LOGI("BL", "0x01,0xFF -> %d", (int)e); break; }
            case 2: { uint8_t d[] = {0x02, 0xFF};       e = id(bus_a)->write(0x24, d, 2, true); ESP_LOGI("BL", "0x02,0xFF -> %d", (int)e); break; }
            case 3: { uint8_t d[] = {0x03, 0x00, 0x01, 0xFF}; id(bus_a)->write(0x24, d, 2, true); uint8_t d2[] = {0x01, 0xFF}; e = id(bus_a)->write(0x24, d2, 2, true); ESP_LOGI("BL", "PCA-style -> %d", (int)e); break; }
          }
          step++;

touchscreen:
  - platform: gt911
    id: waveshare_touch
    address: 0x5D
    interrupt_pin: GPIO4

lvgl:
  displays:
    - waveshare_display
  touchscreens:
    - waveshare_touch
  default_font: montserrat_14

  pages:
    - id: main_page
      bg_color: 0xFFFFFF
      bg_opa: cover
      widgets:
        - label:
            text: "Waveshare 7B - ESPHome OK"
            align: center
            text_color: 0x000000
