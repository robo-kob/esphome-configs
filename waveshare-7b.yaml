display:
  - platform: rpi_dpi_rgb
    id: waveshare_display
    update_interval: never
    auto_clear_enabled: false
    color_order: RGB
    pclk_frequency: 30MHz
    pclk_inverted: true
    dimensions:
      width: 1024
      height: 600
    de_pin: GPIO5
    hsync_pin:
      number: GPIO46
      ignore_strapping_warning: true
    vsync_pin:
      number: GPIO3
      ignore_strapping_warning: true
    pclk_pin: GPIO7
    reset_pin:
      waveshare_io_ch32v003: waveshare_io_hub
      number: 3
    hsync_back_porch:  152
    hsync_front_porch:  48
    hsync_pulse_width: 162
    vsync_back_porch:   13
    vsync_front_porch:   3
    vsync_pulse_width:  45
    data_pins:
      red:
        - 1         # r3
        - 2         # r4
        - 42        # r5
        - 41        # r6
        - 40        # r7
      green:
        - 39        # g2
        - 0         # g3
        - 45        # g4
        - 48        # g5
        - 47        # g6
        - 21        # g7
      blue:
        - 14        # b3
        - 38        # b4
        - 18        # b5
        - 17        # b6
        - 10        # b7

touchscreen:
  - platform: gt911
    id: waveshare_touch
    interrupt_pin: GPIO4
    reset_pin:
      waveshare_io_ch32v003: waveshare_io_hub
      number: 1
      mode: OUTPUT
    on_touch:
      - light.turn_on:
          id: display_backlight
          brightness: 100%

lvgl:
  displays:
    - waveshare_display
  touchscreens:
    - waveshare_touch
  default_font: roboto_24
  on_idle:
    timeout: 60s
    then:
      - light.turn_on:
          id: display_backlight
          brightness: 10%

  style_definitions:
    - id: style_btn
      bg_color: 0x1A1A1A
      bg_opa: cover
      border_width: 1
      border_color: 0x333333
      text_color: 0xFFFFFF
      radius: 8

  pages:
    - id: main_page
      bg_color: 0x000000
      bg_opa: cover

      widgets:
        # Play/Pause Button oben links
        - button:
            id: btn_play_pause
            x: 0
            y: 0
            width: 230
            height: 75
            styles: style_btn
            pressed:
              bg_color: 0x444444
            on_click:
              then:
                - button.press: mxn10_play_pause
            widgets:
              - label:
                  id: lbl_play_pause
                  text: ""
                  text_font: montserrat_28
                  align: center

        # Mute Button oben Mitte
        - button:
            id: btn_mute
            x: 240
            y: 0
            width: 220
            height: 75
            styles: style_btn
            pressed:
              bg_color: 0x444444
            on_click:
              then:
                - button.press: topping_mute
                - lambda: id(mute_active) = !id(mute_active);
                - if:
                    condition:
                      lambda: return id(mute_active);
                    then:
                      - lvgl.label.update:
                          id: lbl_mute
                          text: "Mute"
                          text_color: 0xFF4444
                    else:
                      - lvgl.label.update:
                          id: lbl_mute
                          text: "Mute"
                          text_color: 0xFFFFFF
            widgets:
              - label:
                  id: lbl_mute
                  text: "Mute"
                  align: center

        # Input Button oben rechts
        - button:
            id: btn_input
            x: 790
            y: 0
            width: 234
            height: 75
            styles: style_btn
            pressed:
              bg_color: 0x444444
            on_click:
              then:
                - button.press: topping_input_toggle
            widgets:
              - label:
                  text: "Input"
                  align: center

        # Album Cover (260x260)
        - obj:
            x: 10
            y: 85
            width: 260
            height: 260
            bg_color: 0x1A1A1A
            border_color: 0x333333
            border_width: 1
            radius: 10
            pad_all: 0
            widgets:
              - label:
                  id: lbl_cover_sym
                  text: "?"
                  text_font: montserrat_48
                  text_color: 0x333333
                  align: center
              - image:
                  id: img_cover
                  src: album_cover
                  align: center

        # Titel (gross, scrollend)
        - label:
            id: lbl_title
            x: 285
            y: 90
            width: 729
            height: 50
            text: "Kein Titel"
            text_color: 0xFFFFFF
            text_font: roboto_36
            text_align: center
            long_mode: scroll_circular

        # Artist
        - label:
            id: lbl_artist
            x: 285
            y: 152
            width: 729
            height: 36
            text: "-"
            text_color: 0xCCCCCC
            text_font: roboto_24
            text_align: center
            long_mode: dot

        # Album
        - label:
            id: lbl_album
            x: 285
            y: 196
            width: 729
            height: 32
            text: ""
            text_color: 0xAAAAAA
            text_font: roboto_24
            text_align: center
            long_mode: dot

        # Quelle
        - label:
            id: lbl_source
            x: 285
            y: 236
            width: 729
            height: 26
            text: ""
            text_color: 0x777777
            text_font: roboto_18
            text_align: left
            long_mode: dot

        # Fortschrittsbalken
        - bar:
            id: progress_bar
            x: 50
            y: 375
            width: 924
            height: 14
            min_value: 0
            max_value: 100
            value: 0
            bg_color: 0x333333
            bg_opa: cover
            indicator:
              bg_color: 0x00BCD4
              bg_opa: cover

        # Zeit Position
        - label:
            id: lbl_time_pos
            x: 50
            y: 396
            text: "0:00"
            text_color: 0xFFFFFF
            text_font: roboto_18

        # Zeit Dauer
        - label:
            id: lbl_time_dur
            x: 874
            y: 396
            width: 100
            text: "0:00"
            text_color: 0xFFFFFF
            text_font: roboto_18
            text_align: right

        # Previous Button
        - button:
            id: btn_prev
            x: 0
            y: 430
            width: 256
            height: 170
            styles: style_btn
            pressed:
              bg_color: 0x444444
            on_click:
              then:
                - button.press: mxn10_previous
            widgets:
              - label:
                  id: lbl_prev
                  text: "|<"
                  text_font: montserrat_28
                  align: center

        # Next Button
        - button:
            id: btn_next
            x: 256
            y: 430
            width: 256
            height: 170
            styles: style_btn
            pressed:
              bg_color: 0x444444
            on_click:
              then:
                - button.press: mxn10_next
            widgets:
              - label:
                  id: lbl_next
                  text: ">|"
                  text_font: montserrat_28
                  align: center

        # Vol- Button
        - button:
            id: btn_vol_down
            x: 512
            y: 430
            width: 256
            height: 170
            styles: style_btn
            pressed:
              bg_color: 0x444444
            on_click:
              then:
                - button.press: topping_volume_down
            widgets:
              - label:
                  id: lbl_vol_down
                  text: "v-"
                  text_font: montserrat_28
                  align: center

        # Vol+ Button
        - button:
            id: btn_vol_up
            x: 768
            y: 430
            width: 256
            height: 170
            styles: style_btn
            pressed:
              bg_color: 0x444444
            on_click:
              then:
                - button.press: topping_volume_up
            widgets:
              - label:
                  id: lbl_vol_up
                  text: "v+"
                  text_font: montserrat_28
                  align: center
