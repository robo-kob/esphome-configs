esphome:
  name: esphome-web-c47f0c
  friendly_name: ESPHome Display 7" 1024x600
  min_version: 2026.4.0
  name_add_mac_suffix: false
  platformio_options:
    board_upload.maximum_ram_size: 524288

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 120MHz

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Waveshare 7B Fallback"
    password: "12345678"

captive_portal:

i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true

display:
  - platform: rpi_dpi_rgb
    id: waveshare_display
    update_interval: never
    auto_clear_enabled: false
    color_order: RGB
    pclk_frequency: 45MHz
    pclk_inverted: true
    dimensions:
      width: 1024
      height: 600
    de_pin: GPIO5
    hsync_pin:
      number: GPIO46
      ignore_strapping_warning: true
    vsync_pin:
      number: GPIO3
      ignore_strapping_warning: true
    pclk_pin: GPIO7
    hsync_back_porch: 160
    hsync_front_porch: 160
    hsync_pulse_width: 10
    vsync_back_porch: 23
    vsync_front_porch: 12
    vsync_pulse_width: 3
    data_pins:
      red:
        - 1         # r3
        - 2         # r4
        - 42        # r5
        - 41        # r6
        - 40        # r7
      green:
        - 39        # g2
        - 0         # g3
        - 45        # g4
        - 48        # g5
        - 47        # g6
        - 21        # g7
      blue:
        - 14        # b3
        - 38        # b4
        - 18        # b5
        - 17        # b6
        - 10        # b7

touchscreen:
  - platform: gt911
    id: waveshare_touch
    interrupt_pin: GPIO4

lvgl:
  displays:
    - waveshare_display
  touchscreens:
    - waveshare_touch
  default_font: montserrat_14

  pages:
    - id: main_page
      bg_color: 0x1A1A1A
      bg_opa: cover
      widgets:
        - label:
            text: "Waveshare 7B - ESPHome OK"
            align: center
            text_color: 0xFFFFFF
