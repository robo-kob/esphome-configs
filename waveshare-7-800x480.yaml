# ══════════════════════════════════════════════════════════════════════════
# Waveshare ESP32-S3-Touch-LCD-7  (NON-B Variante, 800x480, CH422G IO-Expander)
# Dashboard: Aussentemperatur, UV-Index, Solar, Hausverbrauch, Wettervorschau
#
# Hardware kommt komplett aus der Community-Package:
#   github.com/inytar/waveshare-esp32-s3-touch-lcd-7-esphome
#   -> stellt bereit: esp32/psram, i2c, ch422g, display (mipi_rgb),
#      touchscreen (gt911), light.lcdbacklight (NUR an/aus, kein PWM),
#      switch.antiburn (laeuft automatisch wenn Backlight aus)
#
# Backlight-Logik (echtes PWM-Dimmen, hier definiert):
#   - Praesenz im Wohnzimmer -> volle Helligkeit (abends gedaempft)
#   - keine Praesenz: nach 60s auf 10% dimmen
#   - keine Praesenz: nach 20min ganz aus (Antiburn laeuft dann automatisch)
# ══════════════════════════════════════════════════════════════════════════

substitutions:
  # ── HA-Entities (bitte in Home Assistant verifizieren) ───────────────────
  ent_outdoor_temp: sensor.gw1100a_outdoor_temperature
  ent_uv_index:     sensor.gw1100a_uv_index
  ent_solar_power:  sensor.solarbank_2_e1600_pro_solarleistung
  ent_house_power:  sensor.poweropti_35fd8_lokal_leistung
  ent_weather:      weather.forecast_home
  # Raum-Praesenz (Wohnzimmer): steuert Display an/dimmen/aus
  ent_room_presence: binary_sensor.prasenz_wohnzimmer_presence
  # Briefkasten-Status (HA input_boolean Helper, von Automation gesetzt)
  ent_mailbox:      input_boolean.post_im_briefkasten
  # Batterie: DIY-Spannungsteiler am "Sensor AD"-Header (P2) = GPIO6 (per Schaltplan)
  batt_adc_pin:     GPIO6
  batt_divider:     "2.0"    # 100k/100k Teiler -> Messwert x2 = echte Akkuspannung
  # ── Helligkeit / Dimmen (echtes PWM, GPIO16 nach Loetbruecke) ────────────
  bright_day:       "1.0"    # Helligkeit tagsueber bei Praesenz (0.0-1.0)
  bright_evening:   "0.35"   # Helligkeit abends bei Praesenz
  bright_dim:       "0.1"    # abgesenkte Helligkeit nach Inaktivitaet
  dim_after_ms:     "60000"    # 60s ohne Touch -> dimmen
  off_after_ms:     "1200000"  # 20min ohne Praesenz (und ohne Touch) -> ganz aus
  dim_start_hour:   "21"     # ab dieser Stunde "abends" (gedaempfte Helligkeit)
  dim_end_hour:     "7"      # ab dieser Stunde wieder "tagsueber"

packages:
  waveshare:
    url: https://github.com/inytar/waveshare-esp32-s3-touch-lcd-7-esphome
    files:
      # Brightness-Variante: PWM-Dimmen ueber GPIO16 (Loetbruecke am Backlight-Pad)
      - path: waveshare-esp32-s3-touch-lcd-7-brightness.yaml
        vars:
          backlight_brightness_pin: "GPIO16"
          initial_brightness: "0.8"
          min_power: "0.1"    # untere Grenze, sonst ist das Display zu dunkel
    # refresh: 1min   # Default ist 1d. Nur zum Debuggen verkuerzen.

esphome:
  name: waveshare-lcd7-dashboard
  friendly_name: Waveshare 7 Dashboard 800x480
  on_boot:
    - priority: -100
      then:
        - lvgl.label.update:
            id: lbl_mailbox_icon
            text: !lambda 'return std::string("\U000F06EE");'  # mdi:mailbox

# PSRAM: Die Package stellt 120MHz octal (experimentell) ein — auf diesem
# ESP32-S3 rev0.2 fuehrt das zu Boot-Crash + OTA-Rollback. Auf stabile
# 80MHz zwingen (ueberschreibt den Package-Wert).
psram:
  mode: octal
  speed: 80MHz

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  # Erst-Upload nach Umbenennung: direkt an die aktuelle IP (mDNS kennt den
  # neuen Namen noch nicht). Kann nach dem ersten erfolgreichen Flash bleiben.
  use_address: 192.168.1.98
  ap:
    ssid: "Waveshare 7 Fallback"
    password: "12345678"

captive_portal:

# Zentraler Helligkeitsregler (alle 250ms):
#   - < 60s seit letztem Touch            -> volle Helligkeit (Tag/Abend)
#   - >= 60s ohne Touch                   -> dimmen
#   - >= 20min ohne Praesenz UND Touch    -> ganz aus (Antiburn laeuft auto)
# Touch setzt LVGLs Inaktivitaet auf 0 -> naechster Tick macht sofort hell.
interval:
  - interval: 250ms
    then:
      - lambda: |-
          uint32_t now = millis();
          uint32_t idle = lv_disp_get_inactive_time(NULL);            // ms seit letztem Touch
          uint32_t pres_ago = id(present) ? 0u : (now - id(present_off_ms));
          float target;
          if (idle >= ${off_after_ms}u && pres_ago >= ${off_after_ms}u) {
            target = -1.0f;                            // aus
          } else if (idle >= ${dim_after_ms}u) {
            target = (float) ${bright_dim};            // gedimmt
          } else {
            target = (float) ${bright_day};            // voll (tagsueber)
            auto t = id(homeassistant_time).now();
            if (t.is_valid()) {
              int h = t.hour, s = ${dim_start_hour}, e = ${dim_end_hour};
              bool evening = (s > e) ? (h >= s || h < e) : (h >= s && h < e);
              if (evening) target = (float) ${bright_evening};
            }
          }
          // nur bei Aenderung anwenden (kein Befehls-Spam)
          if (target > id(applied_bright) - 0.001f && target < id(applied_bright) + 0.001f) return;
          id(applied_bright) = target;
          if (target < 0.0f) {
            id(lcdbacklight_brightness)->turn_off().perform();
          } else {
            auto c = id(lcdbacklight_brightness)->turn_on();
            c.set_brightness(target);
            c.perform();
          }

# ── Zeit (fuer Abend-Helligkeit Tag/Nacht, vom Helligkeitsregler genutzt) ──
time:
  - platform: homeassistant
    id: homeassistant_time

globals:
  - id: present
    type: bool
    restore_value: no
    initial_value: 'true'   # Wohnzimmer als "belegt" annehmen bis HA meldet
  - id: present_off_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'      # millis() als Praesenz zuletzt auf "leer" wechselte
  - id: applied_bright
    type: float
    restore_value: no
    initial_value: '-99'    # zuletzt gesetzte Helligkeit (-1=aus); erzwingt 1. Anwendung

# ── Raum-Praesenz Wohnzimmer (steuert Helligkeit) ──────────────────────────
binary_sensor:
  - platform: homeassistant
    id: lr_presence
    entity_id: ${ent_room_presence}
    internal: true
    on_state:
      # Nur Status + Zeitpunkt des Leerwerdens merken; Helligkeit macht der Regler
      - lambda: |-
          if (id(present) && !x) id(present_off_ms) = millis();
          id(present) = x;

  # ── Briefkasten: Post-Status (input_boolean) -> Kachel rot/gruen ──────────
  - platform: homeassistant
    id: mailbox_post
    entity_id: ${ent_mailbox}
    internal: true
    on_state:
      - if:
          condition:
            lambda: 'return x;'
          then:
            # Post da -> rote Kachel, weisses Icon, "Post!"
            - lvgl.widget.update:
                id: tile_mailbox
                bg_color: 0xE24B4A
            - lvgl.label.update: { id: lbl_mailbox_cap, text_color: 0xFCEBEB }
            - lvgl.label.update: { id: lbl_mailbox_icon, text_color: 0xFFFFFF }
            - lvgl.label.update: { id: lbl_mailbox_txt, text: "Post!", text_color: 0xFFFFFF }
          else:
            # leer -> gruene Kachel, gruenes Icon, "leer"
            - lvgl.widget.update:
                id: tile_mailbox
                bg_color: 0xE7F0E7
            - lvgl.label.update: { id: lbl_mailbox_cap, text_color: 0x88A088 }
            - lvgl.label.update: { id: lbl_mailbox_icon, text_color: 0x6BA368 }
            - lvgl.label.update: { id: lbl_mailbox_txt, text: "leer", text_color: 0x6B8E6B }

