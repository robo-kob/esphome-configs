# ══════════════════════════════════════════════════════════════════════════
# Waveshare ESP32-S3-Touch-LCD-7  (NON-B Variante, 800x480, CH422G IO-Expander)
# Dashboard: Aussentemperatur, UV-Index, Solar, Hausverbrauch, Wettervorschau
#
# Hardware kommt komplett aus der Community-Package:
#   github.com/inytar/waveshare-esp32-s3-touch-lcd-7-esphome
#   -> stellt bereit: esp32/psram, i2c, ch422g, display (mipi_rgb),
#      touchscreen (gt911), light.lcdbacklight (NUR an/aus, kein PWM),
#      switch.antiburn (laeuft automatisch wenn Backlight aus)
#
# Backlight-Logik (hier definiert):
#   - AN  wenn jemand zuhause ist
#   - AUS wenn niemand zuhause
#   - AUS im naechtlichen Antiburn-Fenster 03:00-03:30 (Antiburn laeuft dann auto)
# ══════════════════════════════════════════════════════════════════════════

substitutions:
  # ── HA-Entities (bitte in Home Assistant verifizieren) ───────────────────
  ent_outdoor_temp: sensor.gw1100a_outdoor_temperature
  ent_uv_index:     sensor.gw1100a_uv_index
  ent_solar_power:  sensor.solarbank_2_e1600_pro_solarleistung
  ent_house_power:  sensor.poweropti_35fd8_lokal_leistung
  ent_weather:      weather.forecast_home
  # Praesenz: Backlight an, sobald EINE dieser Personen zuhause ist
  ent_person_1:     person.roland
  ent_person_2:     person.momo
  # Raum-Praesenz (Wohnzimmer): leer >10min -> Display aus
  ent_room_presence: binary_sensor.prasenz_wohnzimmer_presence
  # Briefkasten-Status (HA input_boolean Helper, von Automation gesetzt)
  ent_mailbox:      input_boolean.post_im_briefkasten
  # Abend-Dark-Mode (kein echtes Dimmen — halbtransparente schwarze Ebene)
  dim_start_hour:   "21"     # ab dieser Stunde abdunkeln
  dim_end_hour:     "7"      # ab dieser Stunde wieder hell
  dim_opacity:      "60%"    # Staerke der Abdunklung (0%=aus ... 100%=schwarz)

packages:
  waveshare:
    url: https://github.com/inytar/waveshare-esp32-s3-touch-lcd-7-esphome
    files: [ waveshare-esp32-s3-touch-lcd-7.yaml ]
    # refresh: 1min   # Default ist 1d. Nur zum Debuggen verkuerzen.

esphome:
  name: waveshare-lcd7-dashboard
  friendly_name: Waveshare 7 Dashboard 800x480
  on_boot:
    - priority: -100
      then:
        - lvgl.label.update:
            id: lbl_mailbox_icon
            text: !lambda 'return std::string("\U000F06EE");'  # mdi:mailbox
        - script.execute: update_backlight
        - script.execute: update_dim

# PSRAM: Die Package stellt 120MHz octal (experimentell) ein — auf diesem
# ESP32-S3 rev0.2 fuehrt das zu Boot-Crash + OTA-Rollback. Auf stabile
# 80MHz zwingen (ueberschreibt den Package-Wert).
psram:
  mode: octal
  speed: 80MHz

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  # Erst-Upload nach Umbenennung: direkt an die aktuelle IP (mDNS kennt den
  # neuen Namen noch nicht). Kann nach dem ersten erfolgreichen Flash bleiben.
  use_address: 192.168.1.105
  ap:
    ssid: "Waveshare 7 Fallback"
    password: "12345678"

captive_portal:

# ── Zeit (fuer naechtliches Antiburn-Fenster) ──────────────────────────────
time:
  - platform: homeassistant
    id: homeassistant_time
    on_time_sync:
      # Sobald Zeit von HA da ist: Zustand korrekt setzen
      - script.execute: update_backlight
      - script.execute: update_dim
    on_time:
      # 03:00 Antiburn-Fenster beginnt -> Backlight aus (Antiburn laeuft auto)
      - seconds: 0
        minutes: 0
        hours: 3
        then:
          - script.execute: update_backlight
      # 03:30 Fenster vorbei -> ggf. wieder an (falls jemand zuhause)
      - seconds: 0
        minutes: 30
        hours: 3
        then:
          - script.execute: update_backlight
      # Abend-Dark-Mode an
      - seconds: 0
        minutes: 0
        hours: ${dim_start_hour}
        then:
          - script.execute: update_dim
      # Abend-Dark-Mode aus
      - seconds: 0
        minutes: 0
        hours: ${dim_end_hour}
        then:
          - script.execute: update_dim

globals:
  - id: roland_home
    type: bool
    restore_value: no
    initial_value: 'true'   # bis HA meldet: Screen an
  - id: momo_home
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: lr_present
    type: bool
    restore_value: no
    initial_value: 'true'   # Wohnzimmer als "belegt" annehmen bis HA meldet

# ── Raum-Praesenz Wohnzimmer (10-Min-Nachlauf) ─────────────────────────────
binary_sensor:
  - platform: homeassistant
    id: lr_presence
    entity_id: ${ent_room_presence}
    internal: true
    on_state:
      - if:
          condition:
            lambda: 'return x;'
          then:
            # jemand im Wohnzimmer -> Timer stoppen, sofort an
            - script.stop: lr_empty_timer
            - lambda: 'id(lr_present) = true;'
            - script.execute: update_backlight
          else:
            # Wohnzimmer leer -> 10-Min-Countdown starten
            - script.execute: lr_empty_timer

  # ── Briefkasten: Post-Status (input_boolean) -> Kachel rot/gruen ──────────
  - platform: homeassistant
    id: mailbox_post
    entity_id: ${ent_mailbox}
    internal: true
    on_state:
      - if:
          condition:
            lambda: 'return x;'
          then:
            # Post da -> rote Kachel, weisses Icon, "Post!"
            - lvgl.widget.update:
                id: tile_mailbox
                bg_color: 0xE24B4A
            - lvgl.label.update: { id: lbl_mailbox_cap, text_color: 0xFCEBEB }
            - lvgl.label.update: { id: lbl_mailbox_icon, text_color: 0xFFFFFF }
            - lvgl.label.update: { id: lbl_mailbox_txt, text: "Post!", text_color: 0xFFFFFF }
          else:
            # leer -> gruene Kachel, gruenes Icon, "leer"
            - lvgl.widget.update:
                id: tile_mailbox
                bg_color: 0xE7F0E7
            - lvgl.label.update: { id: lbl_mailbox_cap, text_color: 0x88A088 }
            - lvgl.label.update: { id: lbl_mailbox_icon, text_color: 0x6BA368 }
            - lvgl.label.update: { id: lbl_mailbox_txt, text: "leer", text_color: 0x6B8E6B }

# ── Backlight-Entscheidung ─────────────────────────────────────────────────
script:
  - id: lr_empty_timer
    mode: restart
    then:
      - delay: 10min
      - lambda: 'id(lr_present) = false;'
      - script.execute: update_backlight

  # Abend-Dark-Mode: Overlay je nach Uhrzeit ein/aus
  - id: update_dim
    then:
      - if:
          condition:
            lambda: |-
              auto t = id(homeassistant_time).now();
              if (!t.is_valid()) return false;
              int h = t.hour;
              int s = ${dim_start_hour};
              int e = ${dim_end_hour};
              // Fenster ueber Mitternacht (z.B. 21 -> 7)
              if (s > e) return (h >= s || h < e);
              return (h >= s && h < e);
          then:
            - lvgl.widget.update: { id: dim_overlay, hidden: false }
          else:
            - lvgl.widget.update: { id: dim_overlay, hidden: true }

  - id: update_backlight
    then:
      - if:
          condition:
            lambda: |-
              // Naechtliches Antiburn-Fenster 03:00-03:30 -> aus
              auto t = id(homeassistant_time).now();
              if (t.is_valid()) {
                int mins = t.hour * 60 + t.minute;
                if (mins >= 180 && mins < 210) return false;
              }
              // an wenn jemand zuhause UND Wohnzimmer in den letzten 10min belegt war
              return (id(roland_home) || id(momo_home)) && id(lr_present);
          then:
            - light.turn_on: lcdbacklight
          else:
            - light.turn_off: lcdbacklight

