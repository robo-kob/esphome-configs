# ══════════════════════════════════════════════════════════════════════════
# Sensoren (Home Assistant -> LVGL Labels)
# ══════════════════════════════════════════════════════════════════════════
sensor:
  - platform: homeassistant
    id: outdoor_temp_sensor
    entity_id: ${ent_outdoor_temp}
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_temp
          text: !lambda |-
            char buf[16];
            snprintf(buf, sizeof(buf), "%.1f°C", x);
            return std::string(buf);

  - platform: homeassistant
    id: outdoor_humidity_sensor
    entity_id: sensor.gw1100a_humidity
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_humidity
          text: !lambda |-
            char buf[16];
            snprintf(buf, sizeof(buf), "%.0f%%", x);
            return std::string(buf);

  - platform: homeassistant
    id: rain_24h_sensor
    entity_id: sensor.gw1100a_24h_rain
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_rain
          text: !lambda |-
            char buf[16];
            snprintf(buf, sizeof(buf), "%.1f mm", x);
            return std::string(buf);

  # UV-Index: nur sichtbar bei Wert > 3, Farbe nach Stufe
  - platform: homeassistant
    id: uv_index_sensor
    entity_id: ${ent_uv_index}
    internal: true
    on_value:
      - if:
          condition:
            lambda: return x > 3;
          then:
            - lvgl.widget.update:
                id: lbl_uv
                hidden: false
            - lvgl.label.update:
                id: lbl_uv
                text: !lambda |-
                  char buf[20];
                  snprintf(buf, sizeof(buf), "UV-Index %.0f", x);
                  return std::string(buf);
            - lvgl.label.update:
                id: lbl_uv
                text_color: !lambda |-
                  if (x >= 8) return lv_color_hex(0xCC2222); // sehr hoch
                  if (x >= 6) return lv_color_hex(0xE06600); // hoch
                  return lv_color_hex(0xE0A000);             // mittel (3-5)
          else:
            - lvgl.widget.update:
                id: lbl_uv
                hidden: true

  - platform: homeassistant
    id: solar_power_sensor
    entity_id: ${ent_solar_power}
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_solar
          text: !lambda |-
            char buf[16];
            if (x >= 1000.0f) snprintf(buf, sizeof(buf), "%.1f kW", x/1000.0f);
            else snprintf(buf, sizeof(buf), "%.0f W", x);
            return std::string(buf);

  - platform: homeassistant
    id: house_power_sensor
    entity_id: ${ent_house_power}
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_house
          text: !lambda |-
            char buf[16];
            if (x >= 1000.0f) snprintf(buf, sizeof(buf), "%.1f kW", x/1000.0f);
            else snprintf(buf, sizeof(buf), "%.0f W", x);
            return std::string(buf);

  # Heute Tageshoechst/-tief
  - platform: homeassistant
    id: today_temp_max_sensor
    entity_id: sensor.forecast_tag_0_temp
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_today_max
          text: !lambda |-
            char buf[16];
            snprintf(buf, sizeof(buf), "%.0f°C", x);
            return std::string(buf);
  - platform: homeassistant
    id: today_temp_min_sensor
    entity_id: sensor.forecast_tag_0_temp_min
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_today_min
          text: !lambda |-
            char buf[16];
            snprintf(buf, sizeof(buf), "%.0f°C", x);
            return std::string(buf);

  # Vorhersage Tag 1-3: Max-Temp
  - platform: homeassistant
    id: fc1_temp_sensor
    entity_id: sensor.forecast_tag_1_temp
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_fc1_max
          text: !lambda |-
            char buf[16]; snprintf(buf, sizeof(buf), "%.0f°", x); return std::string(buf);
  - platform: homeassistant
    id: fc2_temp_sensor
    entity_id: sensor.forecast_tag_2_temp
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_fc2_max
          text: !lambda |-
            char buf[16]; snprintf(buf, sizeof(buf), "%.0f°", x); return std::string(buf);
  - platform: homeassistant
    id: fc3_temp_sensor
    entity_id: sensor.forecast_tag_3_temp
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_fc3_max
          text: !lambda |-
            char buf[16]; snprintf(buf, sizeof(buf), "%.0f°", x); return std::string(buf);

  # Vorhersage Tag 1-3: Min-Temp
  - platform: homeassistant
    id: fc1_temp_min_sensor
    entity_id: sensor.forecast_tag_1_temp_min
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_fc1_min
          text: !lambda |-
            char buf[16]; snprintf(buf, sizeof(buf), "%.0f°", x); return std::string(buf);
  - platform: homeassistant
    id: fc2_temp_min_sensor
    entity_id: sensor.forecast_tag_2_temp_min
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_fc2_min
          text: !lambda |-
            char buf[16]; snprintf(buf, sizeof(buf), "%.0f°", x); return std::string(buf);
  - platform: homeassistant
    id: fc3_temp_min_sensor
    entity_id: sensor.forecast_tag_3_temp_min
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_fc3_min
          text: !lambda |-
            char buf[16]; snprintf(buf, sizeof(buf), "%.0f°", x); return std::string(buf);

text_sensor:
  # ── Praesenz: person.* Status ("home" = zuhause) ─────────────────────────
  - platform: homeassistant
    id: person_roland
    entity_id: ${ent_person_1}
    internal: true
    on_value:
      - lambda: 'id(roland_home) = (x == "home");'
      - script.execute: update_backlight
  - platform: homeassistant
    id: person_momo
    entity_id: ${ent_person_2}
    internal: true
    on_value:
      - lambda: 'id(momo_home) = (x == "home");'
      - script.execute: update_backlight

  # Aktuelles Wetter -> Bedingung + Icon
  - platform: homeassistant
    id: weather_state_sensor
    entity_id: ${ent_weather}
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_cond
          text: !lambda |-
            if (x == "sunny")           return std::string("Sonnig");
            if (x == "clear-night")     return std::string("Klare Nacht");
            if (x == "partlycloudy")    return std::string("Teils bewölkt");
            if (x == "cloudy")          return std::string("Bewölkt");
            if (x == "rainy")           return std::string("Regen");
            if (x == "pouring")         return std::string("Starkregen");
            if (x == "snowy")           return std::string("Schnee");
            if (x == "snowy-rainy")     return std::string("Schneeregen");
            if (x == "fog")             return std::string("Nebel");
            if (x == "lightning")       return std::string("Gewitter");
            if (x == "lightning-rainy") return std::string("Gewitterregen");
            if (x == "windy")           return std::string("Windig");
            if (x == "hail")            return std::string("Hagel");
            if (x == "exceptional")     return std::string("Außergewöhnlich");
            return x;
      - lvgl.label.update:
          id: lbl_icon_now
          text: !lambda |-
            if (x == "sunny")           return std::string("\U000F0599");
            if (x == "clear-night")     return std::string("\U000F0594");
            if (x == "partlycloudy")    return std::string("\U000F0595");
            if (x == "cloudy")          return std::string("\U000F0590");
            if (x == "rainy")           return std::string("\U000F0597");
            if (x == "pouring")         return std::string("\U000F0596");
            if (x == "snowy")           return std::string("\U000F0598");
            if (x == "snowy-rainy")     return std::string("\U000F0598");
            if (x == "fog")             return std::string("\U000F0591");
            if (x == "lightning")       return std::string("\U000F0593");
            if (x == "lightning-rainy") return std::string("\U000F067E");
            if (x == "windy")           return std::string("\U000F059D");
            if (x == "hail")            return std::string("\U000F0592");
            return std::string("\U000F0595");

  # Vorhersage-Tagnamen
  - platform: homeassistant
    id: fc1_day_sensor
    entity_id: sensor.forecast_tag_1_name
    internal: true
    on_value:
      - lvgl.label.update: { id: lbl_fc1_day, text: !lambda "return x;" }
  - platform: homeassistant
    id: fc2_day_sensor
    entity_id: sensor.forecast_tag_2_name
    internal: true
    on_value:
      - lvgl.label.update: { id: lbl_fc2_day, text: !lambda "return x;" }
  - platform: homeassistant
    id: fc3_day_sensor
    entity_id: sensor.forecast_tag_3_name
    internal: true
    on_value:
      - lvgl.label.update: { id: lbl_fc3_day, text: !lambda "return x;" }

  # Vorhersage-Icons (Zustand -> MDI)
  - platform: homeassistant
    id: fc1_cond_sensor
    entity_id: sensor.forecast_tag_1_zustand
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_fc1_icon
          text: !lambda |-
            if (x == "sunny") return std::string("\U000F0599");
            if (x == "clear-night") return std::string("\U000F0594");
            if (x == "partlycloudy") return std::string("\U000F0595");
            if (x == "cloudy") return std::string("\U000F0590");
            if (x == "rainy") return std::string("\U000F0597");
            if (x == "pouring") return std::string("\U000F0596");
            if (x == "snowy") return std::string("\U000F0598");
            if (x == "snowy-rainy") return std::string("\U000F0598");
            if (x == "fog") return std::string("\U000F0591");
            if (x == "lightning") return std::string("\U000F0593");
            if (x == "lightning-rainy") return std::string("\U000F067E");
            if (x == "windy") return std::string("\U000F059D");
            if (x == "hail") return std::string("\U000F0592");
            return std::string("\U000F0595");
  - platform: homeassistant
    id: fc2_cond_sensor
    entity_id: sensor.forecast_tag_2_zustand
    internal: true
    on_value:
      - lvgl.label.update:
