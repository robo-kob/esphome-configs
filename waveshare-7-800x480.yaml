# ══════════════════════════════════════════════════════════════════════════
# LVGL: Dashboard-Seite (800x480) — erweitert das LVGL aus der Package
# (Display/Touch sind bereits in der Package gebunden — hier NUR die Seite)
# ══════════════════════════════════════════════════════════════════════════
lvgl:
  default_font: roboto_24
  # Abend-Dark-Mode: halbtransparente Ebene ueber allem (Touch faellt durch)
  top_layer:
    widgets:
      - obj:
          id: dim_overlay
          x: 0
          y: 0
          width: 800
          height: 480
          bg_color: 0x000000
          bg_opa: ${dim_opacity}
          border_width: 0
          radius: 0
          pad_all: 0
          scrollbar_mode: "off"
          clickable: false
          hidden: true
  pages:
    - id: dashboard
      bg_color: 0xEEEBF8
      bg_opa: cover
      widgets:

        # ───────────────────────── HERO: Aussen + Wetter heute ─────────────
        - obj:
            x: 10
            y: 10
            width: 480
            height: 220
            bg_color: 0xFCFBFF
            border_color: 0xCCCADE
            border_width: 1
            radius: 14
            pad_all: 0
            scrollbar_mode: "off"
            widgets:
              - label:
                  x: 18
                  y: 12
                  text: "󰔏"
                  text_font: mdi_22
                  text_color: 0x7B5EA7
              - label:
                  x: 46
                  y: 12
                  text: "Außen"
                  text_font: roboto_18
                  text_color: 0x7B5EA7
              # Grosse Temperatur
              - label:
                  id: lbl_temp
                  x: 18
                  y: 42
                  width: 300
                  text: "--°C"
                  text_font: roboto_64
                  text_color: 0x1A1840
                  text_align: left
              # Wetter-Icon heute (rechts oben)
              - label:
                  id: lbl_icon_now
                  x: 330
                  y: 34
                  width: 130
                  text: ""
                  text_font: mdi_weather_64
                  text_color: 0x555577
                  text_align: center
              # Bedingung
              - label:
                  id: lbl_cond
                  x: 18
                  y: 130
                  width: 444
                  height: 36
                  text: "--"
                  text_font: roboto_28
                  text_color: 0x444466
                  text_align: left
                  long_mode: dot
              # Heute min/max
              - label:
                  x: 18
                  y: 176
                  text: "Heute"
                  text_font: roboto_18
                  text_color: 0x9090AA
              - label:
                  id: lbl_today_min
                  x: 90
                  y: 173
                  width: 70
                  text: "--°C"
                  text_font: roboto_24
                  text_color: 0x2266CC
                  text_align: right
              - label:
                  x: 162
                  y: 173
                  text: "bis"
                  text_font: roboto_24
                  text_color: 0x9090AA
              - label:
                  id: lbl_today_max
                  x: 210
                  y: 173
                  width: 80
                  text: "--°C"
                  text_font: roboto_24
                  text_color: 0xCC4422
                  text_align: left

        # ──────────────── Wetterdetails: Feuchtigkeit + Regen + UV ─────────
        # UV-Index ohne eigenen Rahmen, nur sichtbar wenn Wert > 3
        - obj:
            x: 500
            y: 10
            width: 290
            height: 220
            bg_color: 0xFCFBFF
            border_color: 0xCCCADE
            border_width: 1
            radius: 14
            pad_all: 0
            scrollbar_mode: "off"
            widgets:
              - label:
                  x: 18
                  y: 14
                  text: "Feuchtigkeit"
                  text_font: roboto_18
                  text_color: 0x9090AA
              - label:
                  id: lbl_humidity
                  x: 18
                  y: 36
                  width: 254
                  text: "--%"
                  text_font: roboto_28
                  text_color: 0x1A1840
              - label:
                  x: 18
                  y: 82
                  text: "Regen (24h)"
                  text_font: roboto_18
                  text_color: 0x9090AA
              - label:
                  id: lbl_rain
                  x: 18
                  y: 104
                  width: 254
                  text: "-- mm"
                  text_font: roboto_28
                  text_color: 0x1A1840
              # UV-Index — rahmenlos, hidden bis Wert > 3
              - label:
                  id: lbl_uv
                  x: 18
                  y: 166
                  width: 254
                  text: "UV-Index --"
                  text_font: roboto_28
                  text_color: 0xE0A000
                  hidden: true

        # ───────────────────────── Solar-Leistung ─────────────────────────
        - obj:
            x: 10
            y: 240
            width: 253
            height: 110
            bg_color: 0xFCFBFF
            border_color: 0xCCCADE
            border_width: 1
            radius: 14
            pad_all: 0
            scrollbar_mode: "off"
            widgets:
              - label:
                  x: 18
                  y: 12
                  text: "󰶛"
                  text_font: mdi_22
                  text_color: 0x9090AA
              - label:
                  x: 46
                  y: 12
                  text: "Solar"
                  text_font: roboto_18
                  text_color: 0x9090AA
              - label:
                  id: lbl_solar
                  x: 18
                  y: 48
                  width: 217
                  text: "-- W"
                  text_font: roboto_40
                  text_color: 0x228822
                  text_align: center

        # ───────────────────────── Hausverbrauch ──────────────────────────
        - obj:
            x: 273
            y: 240
            width: 253
            height: 110
            bg_color: 0xFCFBFF
            border_color: 0xCCCADE
            border_width: 1
            radius: 14
            pad_all: 0
            scrollbar_mode: "off"
            widgets:
              - label:
                  x: 18
                  y: 12
                  text: "󱤃"
                  text_font: mdi_22
                  text_color: 0x9090AA
              - label:
                  x: 46
                  y: 12
                  text: "Haus"
                  text_font: roboto_18
                  text_color: 0x9090AA
