                  id: lbl_house
                  x: 18
                  y: 48
                  width: 217
                  text: "-- W"
                  text_font: roboto_40
                  text_color: 0xCC2222
                  text_align: center

        # ──────────── Briefkasten — tappen quittiert (input_boolean off) ───
        - button:
            id: tile_mailbox
            x: 536
            y: 240
            width: 254
            height: 110
            bg_color: 0xE7F0E7
            bg_opa: cover
            border_color: 0xCCCADE
            border_width: 1
            radius: 14
            pad_all: 0
            scrollbar_mode: "off"
            on_click:
              then:
                - homeassistant.action:
                    action: input_boolean.turn_off
                    data:
                      entity_id: ${ent_mailbox}
            widgets:
              - label:
                  id: lbl_mailbox_cap
                  x: 18
                  y: 12
                  text: "Briefkasten"
                  text_font: roboto_18
                  text_color: 0x88A088
