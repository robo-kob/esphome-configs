# ══════════════════════════════════════════════════════════════════════════
# Sensoren (Home Assistant -> LVGL Labels)
# ══════════════════════════════════════════════════════════════════════════
sensor:
  - platform: homeassistant
    id: outdoor_temp_sensor
    entity_id: ${ent_outdoor_temp}
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_temp
          text: !lambda |-
            char buf[16];
            snprintf(buf, sizeof(buf), "%.1f°C", x);
            return std::string(buf);

  - platform: homeassistant
    id: outdoor_humidity_sensor
    entity_id: sensor.gw1100a_humidity
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_humidity
          text: !lambda |-
            char buf[16];
            snprintf(buf, sizeof(buf), "%.0f%%", x);
            return std::string(buf);

  - platform: homeassistant
    id: rain_24h_sensor
    entity_id: sensor.gw1100a_24h_rain
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_rain
          text: !lambda |-
            char buf[16];
            snprintf(buf, sizeof(buf), "%.1f mm", x);
            return std::string(buf);

  # UV-Index: nur sichtbar bei Wert > 3, Farbe nach Stufe
  - platform: homeassistant
    id: uv_index_sensor
    entity_id: ${ent_uv_index}
    internal: true
    on_value:
      - if:
          condition:
            lambda: return x > 3;
          then:
            - lvgl.widget.update:
                id: lbl_uv
                hidden: false
            - lvgl.label.update:
                id: lbl_uv
                text: !lambda |-
                  char buf[20];
                  snprintf(buf, sizeof(buf), "UV-Index %.0f", x);
                  return std::string(buf);
            - lvgl.label.update:
                id: lbl_uv
                text_color: !lambda |-
                  if (x >= 8) return lv_color_hex(0xCC2222); // sehr hoch
                  if (x >= 6) return lv_color_hex(0xE06600); // hoch
                  return lv_color_hex(0xE0A000);             // mittel (3-5)
          else:
            - lvgl.widget.update:
                id: lbl_uv
                hidden: true

  - platform: homeassistant
    id: solar_power_sensor
    entity_id: ${ent_solar_power}
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_solar
          text: !lambda |-
            char buf[16];
            if (x >= 1000.0f) snprintf(buf, sizeof(buf), "%.1f kW", x/1000.0f);
            else snprintf(buf, sizeof(buf), "%.0f W", x);
            return std::string(buf);

  - platform: homeassistant
    id: house_power_sensor
    entity_id: ${ent_house_power}
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_house
          text: !lambda |-
            char buf[16];
            if (x >= 1000.0f) snprintf(buf, sizeof(buf), "%.1f kW", x/1000.0f);
            else snprintf(buf, sizeof(buf), "%.0f W", x);
            return std::string(buf);

  # ── Batterie: Akkuspannung am "Sensor AD"-Header (GPIO6) ──────────────────
  # WICHTIG: braucht DIY-Spannungsteiler:  Akku+ --[100k]--+--[100k]-- GND,
  #          Mittelabgriff an den AD-Pin (Header P2). OHNE Teiler = Anzeige Unsinn.
  - platform: adc
    pin: ${batt_adc_pin}
    id: batt_voltage
    name: "Akkuspannung"
    entity_category: diagnostic
    device_class: voltage
    unit_of_measurement: "V"
    accuracy_decimals: 2
    attenuation: 12db
    update_interval: 30s
    filters:
      - multiply: ${batt_divider}
      - sliding_window_moving_average:
          window_size: 6
          send_every: 6

  # Spannung -> Prozent (Li-Ion Kennlinie); eigene HA-Entitaet + Display-Update
  - platform: template
    id: batt_percent
    name: "Akku"
    device_class: battery
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      float v = id(batt_voltage).state;
      if (isnan(v) || v < 2.5f || v > 4.6f) return {};   // nicht/erst verdrahtet -> kein Wert
      const float vs[] = {3.30f,3.50f,3.60f,3.70f,3.75f,3.85f,3.95f,4.05f,4.20f};
      const float ps[] = {0.0f, 10.0f,20.0f,35.0f,50.0f,65.0f,80.0f,90.0f,100.0f};
      if (v <= vs[0]) return 0.0f;
      if (v >= vs[8]) return 100.0f;
      for (int i = 0; i < 8; i++)
        if (v < vs[i+1]) { float f=(v-vs[i])/(vs[i+1]-vs[i]); return ps[i]+f*(ps[i+1]-ps[i]); }
      return 100.0f;
    on_value:
      - lvgl.label.update:
          id: lbl_batt_pct
          text: !lambda |-
            char buf[8]; snprintf(buf, sizeof(buf), "%.0f%%", x); return std::string(buf);
      - lvgl.label.update:
          id: lbl_batt_icon
          text: !lambda |-
            if (x >= 95) return std::string("\U000F0079");
            if (x >= 85) return std::string("\U000F0082");
            if (x >= 75) return std::string("\U000F0081");
            if (x >= 65) return std::string("\U000F0080");
            if (x >= 55) return std::string("\U000F007F");
            if (x >= 45) return std::string("\U000F007E");
            if (x >= 35) return std::string("\U000F007D");
            if (x >= 25) return std::string("\U000F007C");
            if (x >= 15) return std::string("\U000F007B");
            if (x >= 5)  return std::string("\U000F007A");
            return std::string("\U000F008E");
      - lvgl.label.update:
          id: lbl_batt_icon
          text_color: !lambda |-
            if (x >= 50) return lv_color_hex(0x33A055); // gruen
            if (x >= 25) return lv_color_hex(0xE0A000); // gelb
            if (x >= 10) return lv_color_hex(0xE06600); // orange
            return lv_color_hex(0xCC2222);              // rot
      - lvgl.label.update:
          id: lbl_batt_pct
          text_color: !lambda |-
            if (x >= 50) return lv_color_hex(0x33A055);
            if (x >= 25) return lv_color_hex(0xE0A000);
            if (x >= 10) return lv_color_hex(0xE06600);
            return lv_color_hex(0xCC2222);

  # Heute Tageshoechst/-tief
  - platform: homeassistant
    id: today_temp_max_sensor
    entity_id: sensor.forecast_tag_0_temp
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_today_max
          text: !lambda |-
            char buf[16];
            snprintf(buf, sizeof(buf), "%.0f°C", x);
            return std::string(buf);
  - platform: homeassistant
    id: today_temp_min_sensor
    entity_id: sensor.forecast_tag_0_temp_min
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_today_min
          text: !lambda |-
            char buf[16];
            snprintf(buf, sizeof(buf), "%.0f°C", x);
            return std::string(buf);

  # Vorhersage Tag 1-3: Max-Temp
  - platform: homeassistant
    id: fc1_temp_sensor
    entity_id: sensor.forecast_tag_1_temp
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_fc1_max
          text: !lambda |-
            char buf[16]; snprintf(buf, sizeof(buf), "%.0f°", x); return std::string(buf);
  - platform: homeassistant
    id: fc2_temp_sensor
    entity_id: sensor.forecast_tag_2_temp
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_fc2_max
          text: !lambda |-
            char buf[16]; snprintf(buf, sizeof(buf), "%.0f°", x); return std::string(buf);
  - platform: homeassistant
    id: fc3_temp_sensor
    entity_id: sensor.forecast_tag_3_temp
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_fc3_max
          text: !lambda |-
            char buf[16]; snprintf(buf, sizeof(buf), "%.0f°", x); return std::string(buf);

  # Vorhersage Tag 1-3: Min-Temp
  - platform: homeassistant
    id: fc1_temp_min_sensor
    entity_id: sensor.forecast_tag_1_temp_min
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_fc1_min
          text: !lambda |-
            char buf[16]; snprintf(buf, sizeof(buf), "%.0f°", x); return std::string(buf);
  - platform: homeassistant
    id: fc2_temp_min_sensor
    entity_id: sensor.forecast_tag_2_temp_min
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_fc2_min
          text: !lambda |-
            char buf[16]; snprintf(buf, sizeof(buf), "%.0f°", x); return std::string(buf);
  - platform: homeassistant
    id: fc3_temp_min_sensor
    entity_id: sensor.forecast_tag_3_temp_min
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_fc3_min
          text: !lambda |-
            char buf[16]; snprintf(buf, sizeof(buf), "%.0f°", x); return std::string(buf);

text_sensor:
  # Aktuelles Wetter -> Bedingung + Icon
  - platform: homeassistant
    id: weather_state_sensor
    entity_id: ${ent_weather}
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_cond
          text: !lambda |-
            if (x == "sunny")           return std::string("Sonnig");
            if (x == "clear-night")     return std::string("Klare Nacht");
            if (x == "partlycloudy")    return std::string("Teils bewölkt");
            if (x == "cloudy")          return std::string("Bewölkt");
            if (x == "rainy")           return std::string("Regen");
            if (x == "pouring")         return std::string("Starkregen");
            if (x == "snowy")           return std::string("Schnee");
            if (x == "snowy-rainy")     return std::string("Schneeregen");
            if (x == "fog")             return std::string("Nebel");
            if (x == "lightning")       return std::string("Gewitter");
            if (x == "lightning-rainy") return std::string("Gewitterregen");
            if (x == "windy")           return std::string("Windig");
            if (x == "hail")            return std::string("Hagel");
            if (x == "exceptional")     return std::string("Außergewöhnlich");
            return x;
      - lvgl.label.update:
          id: lbl_icon_now
          text: !lambda |-
            if (x == "sunny")           return std::string("\U000F0599");
            if (x == "clear-night")     return std::string("\U000F0594");
            if (x == "partlycloudy")    return std::string("\U000F0595");
            if (x == "cloudy")          return std::string("\U000F0590");
            if (x == "rainy")           return std::string("\U000F0597");
            if (x == "pouring")         return std::string("\U000F0596");
            if (x == "snowy")           return std::string("\U000F0598");
            if (x == "snowy-rainy")     return std::string("\U000F0598");
            if (x == "fog")             return std::string("\U000F0591");
            if (x == "lightning")       return std::string("\U000F0593");
            if (x == "lightning-rainy") return std::string("\U000F067E");
            if (x == "windy")           return std::string("\U000F059D");
            if (x == "hail")            return std::string("\U000F0592");
            return std::string("\U000F0595");

  # Vorhersage-Tagnamen
  - platform: homeassistant
    id: fc1_day_sensor
    entity_id: sensor.forecast_tag_1_name
    internal: true
    on_value:
      - lvgl.label.update: { id: lbl_fc1_day, text: !lambda "return x;" }
