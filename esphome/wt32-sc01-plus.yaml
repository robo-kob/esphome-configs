button:
  - platform: template
    name: "Prebox Previous"
    id: prebox_previous
    on_press:
      - homeassistant.action:
          action: media_player.media_previous_track
          data:
            entity_id: media_player.prebox

  - platform: template
    name: "Prebox Play Pause"
    id: prebox_play_pause
    on_press:
      - homeassistant.action:
          action: media_player.media_play_pause
          data:
            entity_id: media_player.prebox

  - platform: template
    name: "Prebox Next"
    id: prebox_next
    on_press:
      - homeassistant.action:
          action: media_player.media_next_track
          data:
            entity_id: media_player.prebox

touchscreen:
  - platform: ft63x6
    id: wt32_touch
    interrupt_pin: GPIO7
    reset_pin: GPIO39
    on_touch:
      - output.set_level:
          id: backlight_pwm
          level: 100%

display:
  - platform: mipi_spi
    id: wt32_display
    model: wt32-sc01-plus
    data_rate: 40MHz
    buffer_size: 25%
    update_interval: never
    auto_clear_enabled: false

lvgl:
  displays:
    - wt32_display
  touchscreens:
    - wt32_touch
  default_font: roboto_22
  bg_color: 0xFFFFFF
  border_width: 0
  rotation: 90

  on_idle:
    - timeout: 30s
      then:
        - output.set_level:
            id: backlight_pwm
            level: 15%
    - timeout: 5min
      then:
        - output.set_level:
            id: backlight_pwm
            level: 0%

  pages:
    # ══════════════════════════════════════════════════════════════════════
    # Seite 1: Offline-Anzeige (Prebox nicht verfügbar)
    # ══════════════════════════════════════════════════════════════════════
    - id: page_offline
      bg_color: 0xFFFFFF
      widgets:
        - obj:
            x: 0
            y: 0
            width: 480
            height: 320
            bg_color: 0xFFFFFF
            border_width: 0
            pad_all: 0
            widgets:
              - label:
                  text: !lambda return std::string(LV_SYMBOL_AUDIO);
                  text_font: montserrat_48
                  text_color: 0xCCCEE0
                  align: center
                  y: -40
              - label:
                  text: "Prebox nicht verfügbar"
                  text_font: roboto_22
                  text_color: 0x9898B8
                  text_align: center
                  align: center
                  y: 20
              - label:
                  text: "Bitte Gerät einschalten"
                  text_font: roboto_18
                  text_color: 0xBBBBCC
                  text_align: center
                  align: center
                  y: 50

    # ══════════════════════════════════════════════════════════════════════
    # Seite 2: Mediaplayer
    # ══════════════════════════════════════════════════════════════════════
    - id: page_player
      bg_color: 0xFFFFFF
      widgets:

          # ── Cover-Karte (rechts, 190x190, abgerundete Ecken) ────────────
          # Cover: x=282, y=6, 190x190 → Unterkante bei y=196
          - obj:
              id: cover_card
              x: 278
              y: 6
              width: 196
              height: 196
              radius: 12
              bg_opa: 0
              border_width: 0
              shadow_width: 0
              shadow_opa: 0
              outline_width: 0
              pad_all: 0
              clip_corner: true
              widgets:
                - label:
                    id: lbl_cover_sym
                    text: !lambda return std::string(LV_SYMBOL_AUDIO);
                    text_font: montserrat_48
                    text_color: 0xAAACCC
                    align: center
                - image:
                    id: img_cover
                    src: album_cover
                    align: center
                    hidden: true

          # ── Titel (links oben, scroll bei langem Text) ─────────────────
          # Linke Spalte: x=8..275 (Breite 267)
          - label:
              id: lbl_title
              x: 8
              y: 30
              width: 267
              height: 38
              text: "Kein Titel"
              text_color: 0x1A1830
              text_font: roboto_28
              text_align: center
              long_mode: scroll_circular

          # ── Artist ────────────────────────────────────────────────────
          - label:
              id: lbl_artist
              x: 8
              y: 61
              width: 267
              height: 28
              text: ""
              text_color: 0x5A5880
              text_font: roboto_22
              text_align: center
              long_mode: dot

          # ── Album ─────────────────────────────────────────────────────
          - label:
              id: lbl_album
              x: 8
              y: 90
              width: 267
              height: 22
              text: ""
              text_color: 0x9898B8
              text_font: roboto_18
              text_align: center
              long_mode: dot

          # ── Fortschrittsbalken (volle Breite, unter Cover) ────────────
          - bar:
              id: progress_bar
              x: 8
              y: 225
              width: 464
              height: 6
              min_value: 0
              max_value: 100
              value: 0
              bg_color: 0xDDE0F0
              bg_opa: cover
              indicator:
                bg_color: 0x5B8DD9
                bg_opa: cover
                radius: 3
              radius: 3

          # ── Zeit Position ─────────────────────────────────────────────
          - label:
              id: lbl_time_pos
              x: 8
              y: 237
              text: "0:00"
              text_color: 0x9898B8
              text_font: roboto_15

          # ── Zeit Dauer ────────────────────────────────────────────────
          - label:
              id: lbl_time_dur
              x: 392
              y: 237
              width: 80
              text: "0:00"
              text_color: 0x9898B8
              text_font: roboto_15
              text_align: right

          # ── Buttons (zentriert, kleiner) ───────────────────────────────
          # Prev(46) | 14px | Play(60) | 14px | Next(46) = 180px
          # Mitte y = 284. Start x: (480-180)/2 = 150
          # Prev:  x=150, y=284-23=261
          # Play:  x=150+46+14=210, y=284-30=254
          # Next:  x=210+60+14=284, y=261

          # Previous
          - button:
              id: btn_prev
              x: 150
              y: 261
              width: 46
              height: 46
              bg_color: 0xEEF0FA
              bg_opa: cover
              border_width: 2
              border_color: 0xD0D4EC
              radius: 23
              pressed:
                bg_color: 0xD8DCF4
              on_click:
                then:
                  - button.press: prebox_previous
              widgets:
                - label:
                    id: lbl_prev
                    text: ""
                    text_font: montserrat_20
                    text_color: 0x4A4870
                    align: center

          # Play / Pause (blauer Akzent, etwas größer als Prev/Next)
          - button:
              id: btn_play_pause
              x: 210
              y: 254
              width: 60
              height: 60
              bg_color: 0x5B8DD9
              bg_opa: cover
              border_width: 0
              radius: 30
              pressed:
                bg_color: 0x3D6EB8
              on_click:
                then:
                  - button.press: prebox_play_pause
              widgets:
                - label:
                    id: lbl_play_pause
                    text: ""
                    text_font: montserrat_24
                    text_color: 0xFFFFFF
                    align: center

          # Next
          - button:
              id: btn_next
              x: 284
              y: 261
              width: 46
              height: 46
              bg_color: 0xEEF0FA
              bg_opa: cover
              border_width: 2
              border_color: 0xD0D4EC
              radius: 23
              pressed:
                bg_color: 0xD8DCF4
              on_click:
                then:
                  - button.press: prebox_next
              widgets:
                - label:
                    id: lbl_next
                    text: ""
                    text_font: montserrat_20
                    text_color: 0x4A4870
                    align: center
