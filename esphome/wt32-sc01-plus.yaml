esphome:
  name: esphome-web-58a044
  friendly_name: WT32 SC01 Plus
  platformio_options:
    board_build.flash_mode: dio

  on_boot:
    priority: 800
    then:
      - output.set_level:
          id: backlight_pwm
          level: 100%

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

psram:
  mode: quad
  speed: 80MHz

logger:

globals:
  - id: last_touch_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: local_position_s
    type: float
    restore_value: no
    initial_value: '0'
  - id: local_position_ts
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: cover_loaded
    type: bool
    restore_value: no
    initial_value: 'false'

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

  ap:
    ssid: "WT32-SC01-Plus Fallback"
    password: "12345678"

captive_portal:

http_request:
  useragent: esphome
  timeout: 5s

online_image:
  - id: album_cover
    url: "http://192.168.1.33:8123/"
    format: jpeg
    type: RGB565
    resize: 155x155
    on_download_finished:
      - globals.set:
          id: cover_loaded
          value: 'true'
      - component.update: wt32_display
    on_error:
      - globals.set:
          id: cover_loaded
          value: 'false'
      - component.update: wt32_display

sensor:
  - platform: homeassistant
    id: mxn10_media_duration
    entity_id: media_player.streamer_lossles_mxn10
    attribute: media_duration
    internal: true

  - platform: homeassistant
    id: mxn10_media_position
    entity_id: media_player.streamer_lossles_mxn10
    attribute: media_position
    internal: true
    on_value:
      - lambda: |-
          id(local_position_s) = x;
          id(local_position_ts) = millis();

text_sensor:
  - platform: homeassistant
    id: mxn10_state
    entity_id: media_player.streamer_lossles_mxn10
    internal: true

  - platform: homeassistant
    id: mxn10_title
    entity_id: media_player.streamer_lossles_mxn10
    attribute: media_title
    internal: true

  - platform: homeassistant
    id: mxn10_artist
    entity_id: media_player.streamer_lossles_mxn10
    attribute: media_artist
    internal: true

  - platform: homeassistant
    id: mxn10_album
    entity_id: media_player.streamer_lossles_mxn10
    attribute: media_album_name
    internal: true

  - platform: homeassistant
    id: mxn10_source
    entity_id: media_player.streamer_lossles_mxn10
    attribute: source
    internal: true

  - platform: homeassistant
    id: mxn10_entity_picture
    entity_id: media_player.streamer_lossles_mxn10
    attribute: entity_picture
    internal: true
    on_value:
      - globals.set:
          id: cover_loaded
          value: 'false'
      - lambda: |-
          if (!x.empty()) {
            id(album_cover).set_url(("http://192.168.1.33:8123" + x).c_str());
          }
      - component.update: album_cover

i2c:
  sda: GPIO6
  scl: GPIO5
  scan: true

output:
  - platform: ledc
    id: backlight_pwm
    pin:
      number: GPIO45
      ignore_strapping_warning: true

interval:
  - interval: 10s
    then:
      - output.set_level:
          id: backlight_pwm
          level: 100%

spi:
  - type: octal
    id: octal_spi
    clk_pin: GPIO47
    data_pins:
      - GPIO9
      - number: GPIO46
        ignore_strapping_warning: true
      - number: GPIO3
        ignore_strapping_warning: true
      - GPIO8
      - GPIO18
      - GPIO17
      - GPIO16
      - GPIO15

font:
  - file: "gfonts://Roboto"
    id: roboto_48
    size: 48

  - file: "gfonts://Roboto"
    id: roboto_32
    size: 32

  - file: "gfonts://Roboto"
    id: roboto_24
    size: 24

  - file: "gfonts://Roboto"
    id: roboto_18
    size: 18

button:
  - platform: template
    name: "MXN10 Previous"
    id: mxn10_previous
    on_press:
      - homeassistant.action:
          action: media_player.media_previous_track
          data:
            entity_id: media_player.streamer_lossles_mxn10

  - platform: template
    name: "MXN10 Play Pause"
    id: mxn10_play_pause
    on_press:
      - homeassistant.action:
          action: media_player.media_play_pause
          data:
            entity_id: media_player.streamer_lossles_mxn10

  - platform: template
    name: "MXN10 Next"
    id: mxn10_next
    on_press:
      - homeassistant.action:
          action: media_player.media_next_track
          data:
            entity_id: media_player.streamer_lossles_mxn10

  - platform: template
    name: "Topping Mute"
    id: topping_mute
    on_press:
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.universal_remote
            device: "Topping Pre 90"
            command: "mute"

  - platform: template
    name: "Topping Leiser"
    id: topping_volume_down
    on_press:
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.universal_remote
            device: "Topping Pre 90"
            command: "volume_down"

  - platform: template
    name: "Topping Lauter"
    id: topping_volume_up
    on_press:
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.universal_remote
            device: "Topping Pre 90"
            command: "volume_up"

  - platform: template
    name: "Topping Input"
    id: topping_input_toggle
    on_press:
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.universal_remote
            device: "Topping Pre 90"
            command: "input_rca"

touchscreen:
  - platform: ft63x6
    id: wt32_touch
    interrupt_pin: GPIO7
    reset_pin: GPIO39
    transform:
      swap_xy: true
      mirror_y: true
    on_touch:
      - lambda: |-
          uint32_t now = millis();
          if (now - id(last_touch_ms) < 300) {
            return;
          }
          id(last_touch_ms) = now;

          int x = touch.x;
          int y = touch.y;

          // Play/Pause oben links
          if (x >= 0 && x <= 130 && y >= 0 && y <= 75) {
            id(mxn10_play_pause).press();
            return;
          }

          // Input oben rechts
          if (x >= 350 && x <= 480 && y >= 0 && y <= 75) {
            id(topping_input_toggle).press();
            return;
          }

          // Untere Bedienleiste
          if (y >= 265 && y <= 320) {
            if (x >= 0 && x <= 120) {
              id(mxn10_previous).press();
            } else if (x > 120 && x <= 240) {
              id(mxn10_next).press();
            } else if (x > 240 && x <= 360) {
              id(topping_volume_down).press();
            } else if (x > 360 && x <= 480) {
              id(topping_volume_up).press();
            }
          }

display:
  - platform: mipi_spi
    id: wt32_display
    model: wt32-sc01-plus
    data_rate: 40MHz
    rotation: 90
    buffer_size: 25%
    update_interval: 1s
    lambda: |-
      it.fill(Color::BLACK);

      // Play/Pause oben links
      if (id(mxn10_state).has_state()) {
        if (id(mxn10_state).state == "playing") {
          it.filled_rectangle(30, 10, 10, 32, Color::WHITE);
          it.filled_rectangle(50, 10, 10, 32, Color::WHITE);
        } else {
          for (int i = 0; i < 34; i++) {
            int half_height = (34 - i) / 2;
            it.line(30 + i, 10 + 16 - half_height, 30 + i, 10 + 16 + half_height, Color::WHITE);
          }
        }
      } else {
        it.print(30, 10, id(roboto_24), Color::WHITE, TextAlign::LEFT, "?");
      }

      // Input oben rechts
      it.print(455, 18, id(roboto_24), Color::WHITE, TextAlign::RIGHT, "Input");

      // Album Cover links (155x155)
      if (id(cover_loaded)) {
        it.image(5, 60, id(album_cover));
      } else {
        it.rectangle(5, 60, 155, 155, Color(60, 60, 60));
        it.print(82, 137, id(roboto_18), Color(80, 80, 80), TextAlign::CENTER, "...");
      }

      // Titel
      if (id(mxn10_title).has_state() && id(mxn10_title).state.length() > 0) {
        it.print(320, 80, id(roboto_24), Color::WHITE, TextAlign::CENTER, id(mxn10_title).state.c_str());
      } else {
        it.print(320, 80, id(roboto_24), Color::WHITE, TextAlign::CENTER, "Kein Titel");
      }

      // Artist
      if (id(mxn10_artist).has_state() && id(mxn10_artist).state.length() > 0) {
        it.print(320, 120, id(roboto_18), Color::WHITE, TextAlign::CENTER, id(mxn10_artist).state.c_str());
      } else {
        it.print(320, 120, id(roboto_18), Color::WHITE, TextAlign::CENTER, "-");
      }

      // Album
      if (id(mxn10_album).has_state() && id(mxn10_album).state.length() > 0) {
        it.print(320, 148, id(roboto_18), Color::WHITE, TextAlign::CENTER, id(mxn10_album).state.c_str());
      }

      // Quelle
      if (id(mxn10_source).has_state() && id(mxn10_source).state.length() > 0) {
        it.printf(165, 176, id(roboto_18), Color::WHITE, TextAlign::LEFT, "Quelle: %s", id(mxn10_source).state.c_str());
      }

      // Fortschrittsbalken
      if (id(mxn10_media_duration).has_state() && id(mxn10_media_position).has_state()) {
        float duration = id(mxn10_media_duration).state;
        float position = id(local_position_s);
        if (id(mxn10_state).has_state() && id(mxn10_state).state == "playing") {
          position += (millis() - id(local_position_ts)) / 1000.0f;
        }

        if (duration > 0 && position >= 0) {
          int bar_x = 40, bar_y = 218, bar_w = 400, bar_h = 12;
          float progress = position / duration;
          if (progress < 0) progress = 0;
          if (progress > 1) progress = 1;
          it.rectangle(bar_x, bar_y, bar_w, bar_h, Color::WHITE);
          it.filled_rectangle(bar_x, bar_y, (int)(progress * bar_w), bar_h, Color::WHITE);
          it.printf(40,  243, id(roboto_18), Color::WHITE, TextAlign::LEFT,  "%d:%02d", ((int)position)/60, ((int)position)%60);
          it.printf(440, 243, id(roboto_18), Color::WHITE, TextAlign::RIGHT, "%d:%02d", ((int)duration)/60, ((int)duration)%60);
        } else {
          it.print(240, 222, id(roboto_18), Color::WHITE, TextAlign::CENTER, "Keine Laufzeitdaten");
        }
      } else {
        it.print(240, 222, id(roboto_18), Color::WHITE, TextAlign::CENTER, "Keine Laufzeitdaten");
      }

      // Bedienleiste unten
      it.print(60,  292, id(roboto_18), Color::WHITE, TextAlign::CENTER, "<<");
      it.print(180, 292, id(roboto_18), Color::WHITE, TextAlign::CENTER, ">>");
      it.print(300, 292, id(roboto_18), Color::WHITE, TextAlign::CENTER, "Vol-");
      it.print(420, 292, id(roboto_18), Color::WHITE, TextAlign::CENTER, "Vol+");
