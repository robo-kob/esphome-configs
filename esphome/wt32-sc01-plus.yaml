esphome:
  name: esphome-web-58a044
  friendly_name: WT32 SC01 Plus
  platformio_options:
    board_build.flash_mode: dio

  on_boot:
    - priority: 800
      then:
        - output.set_level:
            id: backlight_pwm
            level: 100%
    - priority: -100
      then:
        - lvgl.page.show: page_offline
        - lvgl.label.update:
            id: lbl_play_pause
            text: !lambda return std::string(LV_SYMBOL_PLAY);
        - lvgl.label.update:
            id: lbl_prev
            text: !lambda return std::string(LV_SYMBOL_PREV);
        - lvgl.label.update:
            id: lbl_next
            text: !lambda return std::string(LV_SYMBOL_NEXT);
        - lvgl.label.update:
            id: lbl_cover_sym
            text: !lambda return std::string(LV_SYMBOL_AUDIO);

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

psram:
  mode: quad
  speed: 80MHz

logger:

globals:
  - id: local_position_s
    type: float
    restore_value: no
    initial_value: '0'
  - id: local_position_ts
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: cover_loaded
    type: bool
    restore_value: no
    initial_value: 'false'

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

  ap:
    ssid: "WT32-SC01-Plus Fallback"
    password: "12345678"

captive_portal:

http_request:
  useragent: esphome
  timeout: 5s

online_image:
  - id: album_cover
    url: "http://192.168.1.33:8123/"
    format: jpeg
    type: RGB565
    resize: 196x196
    on_download_finished:
      - globals.set:
          id: cover_loaded
          value: 'true'
      - lvgl.widget.show: img_cover
      - lvgl.widget.hide: lbl_cover_sym
      - lvgl.image.update:
          id: img_cover
          src: album_cover
    on_error:
      - globals.set:
          id: cover_loaded
          value: 'false'
      - lvgl.widget.hide: img_cover
      - lvgl.widget.show: lbl_cover_sym

sensor:
  - platform: homeassistant
    id: prebox_media_duration
    entity_id: media_player.prebox
    attribute: media_duration
    internal: true

  - platform: homeassistant
    id: prebox_media_position
    entity_id: media_player.prebox
    attribute: media_position
    internal: true
    on_value:
      - lambda: |-
          id(local_position_s) = x;
          id(local_position_ts) = millis();

text_sensor:
  - platform: homeassistant
    id: prebox_state
    entity_id: media_player.prebox
    internal: true
    on_value:
      - if:
          condition:
            lambda: return x == "unavailable" || x.empty();
          then:
            - lvgl.page.show: page_offline
          else:
            - lvgl.page.show: page_player
            - lvgl.label.update:
                id: lbl_play_pause
                text: !lambda |-
                  return std::string(x == "playing" ? LV_SYMBOL_PAUSE : LV_SYMBOL_PLAY);

  - platform: homeassistant
    id: prebox_title
    entity_id: media_player.prebox
    attribute: media_title
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_title
          text: !lambda |-
            return x.length() > 0 ? x : std::string("Kein Titel");

  - platform: homeassistant
    id: prebox_artist
    entity_id: media_player.prebox
    attribute: media_artist
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_artist
          text: !lambda |-
            return x.length() > 0 ? x : std::string("");

  - platform: homeassistant
    id: prebox_album
    entity_id: media_player.prebox
    attribute: media_album_name
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_album
          text: !lambda |-
            return x;

  - platform: homeassistant
    id: prebox_entity_picture
    entity_id: media_player.prebox
    attribute: entity_picture
    internal: true
    on_value:
      - globals.set:
          id: cover_loaded
          value: 'false'
      - lvgl.widget.hide: img_cover
      - lvgl.widget.show: lbl_cover_sym
      - lambda: |-
          if (!x.empty()) {
            id(album_cover).set_url(("http://192.168.1.33:8123" + x).c_str());
          }
      - component.update: album_cover

i2c:
  sda: GPIO6
  scl: GPIO5
  scan: true

output:
  - platform: ledc
    id: backlight_pwm
    pin:
      number: GPIO45
      ignore_strapping_warning: true

interval:
  - interval: 1s
    then:
      - lambda: |-
          if (!id(prebox_media_duration).has_state()) return;
          float duration = id(prebox_media_duration).state;
          if (duration <= 0) return;

          float position = id(local_position_s);
          if (id(prebox_state).has_state() && id(prebox_state).state == "playing") {
            position += (millis() - id(local_position_ts)) / 1000.0f;
          }
          if (position > duration) position = duration;
          if (position < 0) position = 0;

          int percent = (int)(100.0f * position / duration);
          lv_bar_set_value(id(progress_bar), percent, LV_ANIM_OFF);

          char buf[12];
          snprintf(buf, sizeof(buf), "%d:%02d", ((int)position)/60, ((int)position)%60);
          lv_label_set_text(id(lbl_time_pos), buf);
          snprintf(buf, sizeof(buf), "%d:%02d", ((int)duration)/60, ((int)duration)%60);
          lv_label_set_text(id(lbl_time_dur), buf);

spi:
  - type: octal
    id: octal_spi
    clk_pin: GPIO47
    data_pins:
      - GPIO9
      - number: GPIO46
        ignore_strapping_warning: true
      - number: GPIO3
        ignore_strapping_warning: true
      - GPIO8
      - GPIO18
      - GPIO17
      - GPIO16
      - GPIO15

