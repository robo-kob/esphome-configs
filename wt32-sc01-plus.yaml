        glyphs: "ÀÁÂÃÄÅÆÇÈÉÊËÌÍÎÏÐÑÒÓÔÕÖØÙÚÛÜÝÞßàáâãäåæçèéêëìíîïðñòóôõöøùúûüýþÿ¡¿"

  - file: "gfonts://Roboto"
    id: roboto_18
    size: 18
    bpp: 4
    extras:
      - file: "gfonts://Roboto"
        glyphs: "ÀÁÂÃÄÅÆÇÈÉÊËÌÍÎÏÐÑÒÓÔÕÖØÙÚÛÜÝÞßàáâãäåæçèéêëìíîïðñòóôõöøùúûüýþÿ¡¿"

button:
  - platform: template
    name: "MXN10 Previous"
    id: mxn10_previous
    on_press:
      - homeassistant.action:
          action: media_player.media_previous_track
          data:
            entity_id: media_player.streamer_lossles_mxn10

  - platform: template
    name: "MXN10 Play Pause"
    id: mxn10_play_pause
    on_press:
      - homeassistant.action:
          action: media_player.media_play_pause
          data:
            entity_id: media_player.streamer_lossles_mxn10

  - platform: template
    name: "MXN10 Next"
    id: mxn10_next
    on_press:
      - homeassistant.action:
          action: media_player.media_next_track
          data:
            entity_id: media_player.streamer_lossles_mxn10

  - platform: template
    name: "Topping Mute"
    id: topping_mute
    on_press:
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.universal_remote
            device: "Topping Pre 90"
            command: "mute"

  - platform: template
    name: "Topping Leiser"
    id: topping_volume_down
    on_press:
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.universal_remote
            device: "Topping Pre 90"
            command: "volume_down"

  - platform: template
    name: "Topping Lauter"
    id: topping_volume_up
    on_press:
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.universal_remote
            device: "Topping Pre 90"
            command: "volume_up"

  - platform: template
    name: "Topping Input"
    id: topping_input_toggle
    on_press:
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.universal_remote
            device: "Topping Pre 90"
            command: "input_rca"

touchscreen:
  - platform: ft63x6
    id: wt32_touch
    interrupt_pin: GPIO7
    reset_pin: GPIO39
    on_touch:
      - output.set_level:
          id: backlight_pwm
          level: 100%

display:
  - platform: mipi_spi
    id: wt32_display
    model: wt32-sc01-plus
    data_rate: 40MHz
    buffer_size: 25%

lvgl:
  displays:
    - wt32_display
  touchscreens:
    - wt32_touch
  rotation: 90
  default_font: roboto_18
  on_idle:
    timeout: 60s
    then:
      - output.set_level:
          id: backlight_pwm
          level: 10%

  style_definitions:
    - id: style_btn
      bg_color: 0x1A1A1A
      bg_opa: cover
      border_width: 1
      border_color: 0x333333
      text_color: 0xFFFFFF
      radius: 6

  pages:
    - id: main_page
      bg_color: 0x000000
      bg_opa: cover

      widgets:
        # Play/Pause Button oben links
        - button:
            id: btn_play_pause
            x: 0
            y: 0
            width: 130
            height: 55
            styles: style_btn
            pressed:
              bg_color: 0x444444
            on_click:
              then:
                - button.press: mxn10_play_pause
            widgets:
              - label:
                  id: lbl_play_pause
                  text: ""
                  text_font: montserrat_20
                  align: center

        # Mute Button oben Mitte
        - button:
            id: btn_mute
            x: 175
            y: 0
            width: 130
            height: 55
            styles: style_btn
            pressed:
              bg_color: 0x444444
            on_click:
              then:
                - button.press: topping_mute
                - lambda: id(mute_active) = !id(mute_active);
                - if:
                    condition:
                      lambda: return id(mute_active);
                    then:
                      - lvgl.label.update:
                          id: lbl_mute
                          text: "Mute"
                          text_color: 0xFF4444
                    else:
                      - lvgl.label.update:
                          id: lbl_mute
                          text: !lambda return std::string(LV_SYMBOL_VOLUME_MAX);
                          text_color: 0xFFFFFF
            widgets:
              - label:
                  id: lbl_mute
                  text: "M"
                  text_font: montserrat_20
                  align: center

        # Input Button oben rechts
        - button:
            id: btn_input
            x: 350
            y: 0
            width: 130
            height: 55
            styles: style_btn
            pressed:
              bg_color: 0x444444
            on_click:
              then:
                - button.press: topping_input_toggle
            widgets:
              - label:
                  text: "Input"
                  align: center

        # Album Cover
        - obj:
            x: 5
            y: 60
            width: 155
            height: 155
            bg_color: 0x1A1A1A
            border_color: 0x333333
            border_width: 1
            radius: 8
            pad_all: 0
            widgets:
              - label:
                  id: lbl_cover_sym
                  text: "?"
                  text_font: montserrat_48
                  text_color: 0x333333
                  align: center
              - image:
                  id: img_cover
                  src: album_cover
                  align: center

        # Titel
        - label:
            id: lbl_title
            x: 165
            y: 68
            width: 310
            height: 35
            text: "Kein Titel"
            text_color: 0xFFFFFF
            text_font: roboto_24
            text_align: center
            long_mode: scroll_circular

        # Artist
        - label:
            id: lbl_artist
            x: 165
            y: 108
            width: 310
            height: 26
            text: "-"
            text_color: 0xCCCCCC
            text_align: center
            long_mode: dot

        # Album
        - label:
            id: lbl_album
            x: 165
            y: 135
            width: 310
            height: 26
            text: ""
            text_color: 0xAAAAAA
            text_align: center
            long_mode: dot

        # Quelle
        - label:
            id: lbl_source
            x: 165
            y: 162
            width: 310
            height: 26
            text: ""
            text_color: 0x777777
            text_align: left
            long_mode: dot

        # Fortschrittsbalken
        - bar:
            id: progress_bar
            x: 40
            y: 218
            width: 400
            height: 12
            min_value: 0
            max_value: 100
            value: 0
            bg_color: 0x333333
            bg_opa: cover
            indicator:
              bg_color: 0x00BCD4
              bg_opa: cover

        # Zeit Position
        - label:
            id: lbl_time_pos
            x: 40
            y: 235
            text: "0:00"
            text_color: 0xFFFFFF

        # Zeit Dauer
        - label:
            id: lbl_time_dur
            x: 400
            y: 235
            width: 75
            text: "0:00"
            text_color: 0xFFFFFF
            text_align: right

        # Previous Button
        - button:
            id: btn_prev
            x: 0
            y: 265
            width: 120
            height: 55
            styles: style_btn
            pressed:
              bg_color: 0x444444
            on_click:
              then:
                - button.press: mxn10_previous
            widgets:
              - label:
                  id: lbl_prev
                  text: "|<"
                  text_font: montserrat_20
                  align: center

        # Next Button
        - button:
            id: btn_next
            x: 120
            y: 265
            width: 120
            height: 55
            styles: style_btn
            pressed:
              bg_color: 0x444444
            on_click:
              then:
                - button.press: mxn10_next
            widgets:
              - label:
                  id: lbl_next
                  text: ">|"
                  text_font: montserrat_20
                  align: center

        # Vol- Button
        - button:
            id: btn_vol_down
            x: 240
            y: 265
            width: 120
            height: 55
            styles: style_btn
            pressed:
              bg_color: 0x444444
            on_click:
              then:
                - button.press: topping_volume_down
            widgets:
              - label:
                  id: lbl_vol_down
                  text: "v-"
                  text_font: montserrat_20
                  align: center

        # Vol+ Button
        - button:
            id: btn_vol_up
            x: 360
            y: 265
            width: 120
            height: 55
            styles: style_btn
            pressed:
              bg_color: 0x444444
            on_click:
              then:
                - button.press: topping_volume_up
            widgets:
              - label:
                  id: lbl_vol_up
                  text: "v+"
                  text_font: montserrat_20
                  align: center
