alias: OpenEPaperLink - Familienkalender groß aktualisieren
description: Zeigt Kalendertermine auf dem 7.5 Zoll Tag, Querformat, 3 Spalten.
triggers:
  - trigger: time
    at: "06:00:00"
  - trigger: time
    at: "12:00:00"
  - trigger: time
    at: "18:00:00"
  - trigger: homeassistant
    event: start
conditions: []
actions:
  - action: calendar.get_events
    target:
      entity_id:
        - calendar.familienkalender
        - calendar.feiertage_hessen
        - calendar.ferien_hessen
        - calendar.elw_abfallkalender
    data:
      start_date_time: "{{ today_at('00:00').isoformat() }}"
      end_date_time: "{{ (now() + timedelta(days=3)).isoformat() }}"
    response_variable: kalender
  - action: weather.get_forecasts
    target:
      entity_id: weather.forecast_home
    data:
      type: daily
    response_variable: wetter
  - variables:
      wochentage: Montag,Dienstag,Mittwoch,Donnerstag,Freitag,Samstag,Sonntag
      tag0_date: "{{ now().strftime('%Y-%m-%d') }}"
      tag1_date: "{{ (now() + timedelta(days=1)).strftime('%Y-%m-%d') }}"
      tag2_date: "{{ (now() + timedelta(days=2)).strftime('%Y-%m-%d') }}"
      tag0_label: >-
        {{ wochentage.split(',')[now().weekday()] }}, {{
        now().strftime('%d.%m.') }}
      tag1_label: >-
        {{ wochentage.split(',')[(now() + timedelta(days=1)).weekday()] }}, {{
        (now() + timedelta(days=1)).strftime('%d.%m.') }}
      tag2_label: >-
        {{ wochentage.split(',')[(now() + timedelta(days=2)).weekday()] }}, {{
        (now() + timedelta(days=2)).strftime('%d.%m.') }}
      naechste_aktualisierung: |-
        {% set h = now().hour %}
        {% if h < 6 %}06:00
        {% elif h < 12 %}12:00
        {% elif h < 18 %}18:00
        {% else %}06:00 (morgen)
        {% endif %}
      wetter_text: |-
        {%- set forecast = wetter['weather.forecast_home'].forecast -%}
        {%- if forecast | count > 0 -%}
          {%- set heute = forecast[0] -%}
          {%- set zustand = heute.condition -%}
          {%- set zustand_de = {
            'sunny': 'sonnig',
            'clear-night': 'klar',
            'partlycloudy': 'leicht bewölkt',
            'cloudy': 'bewölkt',
            'fog': 'neblig',
            'rainy': 'regnerisch',
            'pouring': 'Starkregen',
            'snowy': 'schneeig',
            'snowy-rainy': 'Schneeregen',
            'windy': 'windig',
            'windy-variant': 'böig',
            'hail': 'Hagel',
            'lightning': 'Gewitter',
            'lightning-rainy': 'Gewitter+Regen',
            'exceptional': 'außergewöhnlich'
          } -%}
          {%- set tmin = heute.templow | round(0) | int -%}
          {%- set tmax = heute.temperature | round(0) | int -%}
          {{- tmin }}°-{{ tmax }}°C  {{ zustand_de.get(zustand, zustand) }}
        {%- else -%}
          Keine Wetterdaten
        {%- endif -%}
  - variables:
      alle_lines: |-
        {% set ns = namespace(lines=[]) %}
        {% for cal_id, cal_data in kalender.items() %}
          {% for event in cal_data.events %}
            {% set event_start = as_datetime(event.start) %}
            {% set event_end = as_datetime(event.end) %}
            {% set is_allday = 'T' not in event.start %}
            {% set title = event.summary | default('Termin') %}
            {% if cal_id == 'calendar.elw_abfallkalender' %}
              {% set label = 'Müll: ' ~ title %}
            {% elif cal_id == 'calendar.feiertage_hessen' %}
              {% set label = 'Feiertag: ' ~ title %}
            {% elif cal_id == 'calendar.ferien_hessen' %}
              {% set label = 'Ferien: ' ~ title %}
            {% elif not is_allday %}
              {% set label = event_start.strftime('%H:%M') ~ ' ' ~ title %}
            {% else %}
              {% set label = title %}
            {% endif %}
            {% for offset in [0, 1, 2] %}
              {% set check_date = (now() + timedelta(days=offset)).strftime('%Y-%m-%d') %}
              {% set check_dt = as_datetime(check_date) %}
              {% if is_allday %}
                {% if event_start <= check_dt < event_end %}
                  {% set ns.lines = ns.lines + [check_date ~ '||||' ~ check_date ~ event_start.strftime('%H%M') ~ '||||' ~ label] %}
                {% endif %}
              {% else %}
                {% if event_start.strftime('%Y-%m-%d') == check_date %}
                  {% set ns.lines = ns.lines + [check_date ~ '||||' ~ check_date ~ event_start.strftime('%H%M') ~ '||||' ~ label] %}
                {% endif %}
              {% endif %}
            {% endfor %}
          {% endfor %}
        {% endfor %}
        {{ ns.lines | sort | join('~~~~') }}
  - variables:
      tag0_lines: >-
        {% set all = alle_lines.split('~~~~') %}

        {% set ns = namespace(out=[]) %}

        {% for item in all %}
          {% set parts = item.split('||||') %}
          {% if parts | count >= 3 and parts[0] == tag0_date %}
            {% set t = parts[2] %}
            {% if t | length > 25 %}
              {% set ns.out = ns.out + [t[:22] ~ '...'] %}
            {% else %}
              {% set ns.out = ns.out + [t] %}
            {% endif %}
          {% endif %}
        {% endfor %}

        {% if ns.out | count == 0 %}Keine Termine{% else %}{{ ns.out |
        join('~~~~') }}{% endif %}
      tag1_lines: >-
        {% set all = alle_lines.split('~~~~') %}

        {% set ns = namespace(out=[]) %}

        {% for item in all %}
          {% set parts = item.split('||||') %}
          {% if parts | count >= 3 and parts[0] == tag1_date %}
            {% set t = parts[2] %}
            {% if t | length > 25 %}
              {% set ns.out = ns.out + [t[:22] ~ '...'] %}
            {% else %}
              {% set ns.out = ns.out + [t] %}
            {% endif %}
          {% endif %}
        {% endfor %}

        {% if ns.out | count == 0 %}Keine Termine{% else %}{{ ns.out |
        join('~~~~') }}{% endif %}
      tag2_lines: >-
        {% set all = alle_lines.split('~~~~') %}

        {% set ns = namespace(out=[]) %}

        {% for item in all %}
          {% set parts = item.split('||||') %}
          {% if parts | count >= 3 and parts[0] == tag2_date %}
            {% set t = parts[2] %}
            {% if t | length > 25 %}
              {% set ns.out = ns.out + [t[:22] ~ '...'] %}
